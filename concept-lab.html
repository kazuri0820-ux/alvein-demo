function viewA(s){let h=s.heroes[s.active],tiles='';for(let y=0;y<7;y++)for(let x=0;x<6;x++){let p=E.at(s,x,y),w=E.wall(s,x,y),cv=s.covers.some(q=>q[0]===x&&q[1]===y),exit=x===2&&y===6,pr=!s.carrier&&x===s.prison[0]&&y===s.prison[1],d=E.path(s,h,x,y),reachable=h.hp>0&&h.ap>0&&d>0&&d<=3,enemy=p&&p.id[0]==='e',target=enemy&&h.hp>0&&h.ap>0&&E.dist(h,p)<=h.range&&E.line(s,h,p),cls='tile'+(w?' wall':'')+(cv?' cover':'')+(exit?' exit':'')+(pr?' prison':'')+(reachable?' reach':'')+(target?' target':'')+(p===h?' selected':'');tiles+=btn(p?(enemy?'<span style="color:#e9a08c">'+(p.range>1?'♜':'♞')+'</span><small>'+p.hp+' HP</small>':portrait(p.name,p.job)+'<small>'+(p.id===s.carrier?'救出者':p.ap+'AP')+'</small>'):pr?'♙':exit?'⚑':cv?'▥':w?'':'·','cell:'+x+':'+y,s.phase!=='play',cls)}
return hud([['ターン',s.round+'/12'],['捕虜',s.carrier?'救出済':'未救出'],['操作中',h.name]])+result(s)+'<div class="panel"><h3>霧の砦</h3><small>緑：移動可　赤：攻撃可　♙：捕虜　⚑：脱出口</small><div class="grid">'+tiles+'</div><div class="three">'+s.heroes.map((p,i)=>btn(p.name+' · '+E.jobs[p.job]+hp(p.hp,p.max)+'HP '+p.hp+'/'+p.max+' · AP '+p.ap,'select:'+i,p.hp<=0||s.phase!=='play',s.active===i?'sel':'alt')).join('')+'</div><p class="muted mini">味方を選択し、緑のマスに移動または赤の敵を攻撃。壁は射線を遮る。遮蔽物で被害軽減。救出者を脱出口まで戻す。</p>'+btn('敵ターンへ','end',s.phase!=='play','full')+'</div><div class="panel"><h3>敵の行動予測</h3><div class="log">'+s.enemies.filter(e=>e.hp>0).map(e=>{let p=E.target(s,e);return p?e.name+' → '+p.name+(E.dist(e,p)<=e.range&&E.line(s,e,p)?' 攻撃圏内':' 接近予定'):''}).join('\n')+'</div></div>'+logs(s)}
function viewB(s){return hud([['日数',s.day+'/14'],['金貨',s.gold],['名声',s.rep+'/30']])+result(s)+'<div class="panel"><h3>王国の掲示板</h3>'+E.missions.map((m,i)=>'<div class="person"><div class="info"><b>'+m.name+'</b><p class="stat">'+m.kind+'向き · 危険 '+m.risk+' · 報奨 '+s.bounty[i]+'G</p></div>'+btn('報奨 +3G','bounty:'+i,s.gold<3||s.bounty[i]>=15||s.phase!=='play')+'</div>').join('')+'<div class="person"><div class="info"><b>宿屋 Lv.'+s.inn+'</b><p class="stat">休養時の回復量増加</p></div>'+btn('建設12G','inn',s.gold<12||s.inn>=3||s.phase!=='play')+'</div></div><div class="panel"><h3>自律行動する英雄たち</h3>'+s.heroes.map((p,i)=>'<div class="person">'+portrait(p.name,i)+'<div class="info"><b>'+p.name+'</b> <span class="tag">'+p.kind+'</span><p class="stat">戦力 '+p.skill+' · 所持金 '+p.wealth+'G · HP '+p.hp+'</p>'+hp(p.hp,10)+'<small>'+p.activity+'</small></div></div>').join('')+btn('1日進める · 英雄が判断','day',s.phase!=='play','full')+'</div>'+logs(s)}
function viewC(s){let o=E.opponents[Math.min(s.week-1,5)];return hud([['週',Math.min(s.week,6)+'/6'],['資金',s.gold],['勝点',s.rank+'/10']])+result(s)+'<div class="panel"><h3>対戦相手：'+o[0]+'</h3><p class="stat">攻 '+o[2]+' · 守 '+o[3]+' · 苦手 '+o[1]+'</p><div class="three">'+s.slots.map((id,i)=>{let p=s.roster.find(x=>x.id===id);return btn(['前衛','中衛','後衛'][i]+'<br>'+p.name+'<br>気力 '+p.energy,'slot:'+i,false,slot===i?'sel':'alt')}).join('')+'</div><div class="acts">'+['均衡','速攻','防衛','術撃'].map(p=>btn(p,'plan:'+p,s.phase!=='play',s.plan===p?'sel':'alt')).join('')+'</div>'+btn('試合開始 · 采配の結果を見る','match',s.phase!=='play','full')+'</div><div class="panel"><h3>所属騎士</h3><small>枠を選んで配置。鍛錬は資金と気力を消費。</small>'+s.roster.map(p=>'<div class="person">'+portrait(p.name,p.job)+'<div class="info"><b>'+p.name+'</b> <small>'+E.jobs[p.job]+'</small><p class="stat">攻 '+p.atk+' 守 '+p.def+' 才能 '+p.potential+'/10</p><small>'+p.trait+' · 気力 '+p.energy+'</small></div><div>'+btn('配置','assign:'+p.id,s.phase!=='play'||s.slots[slot]===p.id,'alt')+btn('鍛錬2','train:'+p.id,s.gold<2||p.energy<3||s.phase!=='play','alt')+'</div></div>').join('')+'</div><div class="panel"><h3>スカウト候補</h3>'+s.market.map(p=>'<div class="person">'+portrait(p.name,p.job)+'<div class="info"><b>'+p.name+'</b> <small>'+E.jobs[p.job]+'</small><p class="stat">攻 '+p.atk+' 守 '+p.def+' 才能 '+(p.scouted?p.potential:'？')+'</p><small>'+p.trait+'</small></div><div>'+btn('調査1','scout:'+p.id,p.scouted||s.gold<1||s.phase!=='play','alt')+btn('契約4','hire:'+p.id,s.gold<4||s.phase!=='play')+'</div></div>').join('')+'</div>'+logs(s)}
function viewD(s){let q=E.stories[s.chapter];return hud([['絆',s.trust],['希望',s.hope],['負傷',s.wounds]])+result(s)+'<div class="panel"><canvas id="storyart" class="storyart" width="320" height="128"></canvas><p class="tag">第'+Math.min(s.chapter+1,5)+'章 · 食料 '+s.food+'</p><h2>'+(q?q[0]:'旅の結末')+'</h2><p>'+(q?q[1]:'二人の運命が決まった。')+'</p><div class="row"><div>レオン<br><b class="tag">'+s.hero+'</b></div><div>ミラ<br><b class="tag">'+s.friend+'</b></div></div>'+(s.phase==='play'?q[2].map((c,i)=>btn(c[0],'choice:'+i,false,'alt choice')).join(''):'')+'</div><div class="panel"><h3>人生の記録</h3><p>'+ (s.memory.length?s.memory.join(' → '):'まだ何者でもない。')+'</p></div>'+logs(s)}
function art(){if(!P)return;document.querySelectorAll('canvas[data-name]').forEach(c=>{let j=Number(c.dataset.job);P.draw(c,P.make(c.dataset.name,{species:'human',job:['guard','ranger','mage'][j],weapon:['sword','bow','staff'][j],armor:['plate','leather','robe'][j]}),2)});let c=$('storyart');if(!c)return;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#506b63');g.addColorStop(1,'#b6a17a');x.fillStyle=g;x.fillRect(0,0,320,128);for(let i=0;i<11;i++){x.fillStyle=i%2?'#3b4f3e':'#53694d';x.beginPath();x.moveTo(i*34-30,100);x.lineTo(i*34,30+i%3*13);x.lineTo(i*34+40,100);x.fill()}x.fillStyle='#3c4e35';x.fillRect(0,100,320,28);x.fillStyle='#8b7d5d';x.fillRect(0,110,320,15);P.render(x,P.make('leon',{job:states.D.chapter>=4?'royal':'guard',weapon:'sword',armor:states.D.chapter>=4?'plate':'tunic'}),100,57,2);P.render(x,P.make('mira',{job:'ranger',weapon:'bow',armor:'leather'}),165,57,2)}
function render(){$('nav').innerHTML=Object.entries(titles).map(([k,t])=>btn('<b>'+k+'</b>'+t[0],'mode:'+k,false,k===mode?'sel':'alt')).join('');let t=titles[mode];$('view').innerHTML='<div class="kicker">'+t[2]+'</div><h2>'+t[1]+'</h2>'+({A:viewA,B:viewB,C:viewC,D:viewD}[mode])(states[mode]);art()}
document.addEventListener('click',ev=>{let b=ev.target.closest('button[data-a]');if(!b||b.disabled)return;let [a,i,j]=b.dataset.a.split(':'),s=states[mode],n=Number(i);if(a==='mode'){mode=i;slot=0}else if(a==='reset'){states[mode]=E[mode]();slot=0}else if(mode==='A'){if(a==='cell')E.actionA(s,n,Number(j));if(a==='select'&&s.heroes[n].hp>0)s.active=n;if(a==='end')E.endA(s)}else if(mode==='B'){if(a==='bounty')E.bountyB(s,n);if(a==='inn')E.innB(s);if(a==='day')E.dayB(s)}else if(mode==='C'){if(a==='slot')slot=n;if(a==='assign')E.slotC(s,slot,n);if(a==='scout')E.scoutC(s,n);if(a==='hire')E.hireC(s,n);if(a==='train')E.trainC(s,n);if(a==='plan')s.plan=i;if(a==='match')E.matchC(s)}else if(mode==='D'&&a==='choice')E.choiceD(s,n);render()});render();
</script></body></html>
