function prep(s){if(s.stage==='final')return '<div class="result"><h2>遠征終了</h2><p>成功 '+s.wins+' / 3作戦</p></div>';if(s.k==='W')return '<div class="panel"><h3>アデルの運命</h3><p>選択が戦闘中の覚醒条件を決める。</p>'+btn('仲間を守る誓い','choice:誓い',false,'full')+btn('力への野心','choice:野心',false,'full')+'</div>';return hud([['作戦',s.chapter+'/3'],['資金',s.gold],['成功',s.wins]])+'<div class="panel"><h3>出撃メンバー</h3><div class="three">'+s.slots.map((id,i)=>btn(s.roster.find(p=>p.id===id).name,'slot:'+i,false,slot===i?'sel':'alt')).join('')+'</div><small>枠を選び、人物を配置。疲労・負傷は開始HPに影響。</small>'+btn('出撃','start',false,'full')+btn('全員休養 2G','rest',s.gold<2,'alt full')+'</div><div class="panel"><h3>所属騎士</h3>'+s.roster.map(p=>'<div class="person">'+portrait(p.name,p.job)+'<div class="info"><b>'+p.name+' · '+E.jobs[p.job]+'</b><p class="stat">攻 '+p.atk+' / HP '+p.max+' / 才能 '+p.potential+'</p><small>疲労 '+p.fatigue+' · 負傷 '+p.injury+' · 経験 '+p.xp+'</small></div><div>'+btn('配置','assign:'+p.id,s.slots[slot]===p.id,'alt')+btn('鍛錬2','train:'+p.id,s.gold<2||p.fatigue>=6,'alt')+'</div></div>').join('')+'</div>'}
function battle(s){let h=s.heroes[s.active],danger=E.rays(s),tiles='';for(let y=0;y<7;y++)for(let x=0;x<6;x++){let p=E.at(s,x,y),w=E.wall(s,x,y),cv=s.covers.some(q=>q[0]===x&&q[1]===y),v=E.village(s,x,y),d=E.path(s,h,x,y),reach=h.hp>0&&h.ap>0&&d>0&&d<=3&&!v,enemy=p&&p.id[0]==='e',target=enemy&&h.ap>0&&(pushing?E.dist(h,p)===1:E.dist(h,p)<=h.range&&E.line(s,h,p)),fire=danger.some(q=>q[0]===x&&q[1]===y),cls='tile'+(w?' wall':'')+(cv?' cover':'')+(reach?' reach':'')+(target?' target':'')+(p===h?' selected':'')+(fire?' danger':'');tiles+=btn(p?(enemy?'<span class="foe">'+(p.range>1?'♜':'♞')+'</span><small>'+p.hp+' HP</small>':portrait(p.name,p.job)+'<small>'+p.ap+'AP</small>'):v?'⌂<small>'+v.hp+'HP</small>':cv?'▥':w?'':'·','cell:'+x+':'+y,s.phase!=='play',cls)}
let extra='';if(s.k==='M')extra='<div class="panel"><h3>仲間への方針</h3>'+s.heroes.slice(1).map((p,i)=>'<div class="person"><div class="info">'+p.name+'<br><small>'+s.orders[i]+'</small></div><div class="acts">'+['援護','護衛','突撃'].map(o=>btn(o,'order:'+i+':'+o,s.phase!=='play',s.orders[i]===o?'sel':'alt')).join('')+'</div></div>').join('')+'<small>ターン終了時、仲間が自律移動・攻撃。</small></div>';
if(s.k==='W')extra='<div class="panel"><h3>'+(s.awake?(s.choice==='誓い'?'守誓騎士':'黒星剣士'):'覚醒への道')+'</h3><p>'+(s.choice==='誓い'?'引き受けた傷 '+s.bond+'/3':'アデルの撃破 '+s.kills+'/2')+'</p>'+(s.choice==='誓い'?btn('選択中の仲間の傷を引き受ける','oath',s.phase!=='play'||h===s.heroes[0]||h.hp>=h.max||h.hp<=0||s.heroes[0].hp<=3||s.heroes[0].ap<1||E.dist(h,s.heroes[0])>3,'full'):'<small>覚醒すると攻撃力・射程が変化。</small>')+'</div>';
if(s.k==='I')extra='<div class="panel"><h3>攻撃予告</h3><p class="stat">橙色に次の攻撃。隣接した敵を押し出し、攻撃の軌道をずらす。</p>'+btn(pushing?'押し出し選択中 · 解除':'押し出しに切替','pushmode',s.phase!=='play',pushing?'sel full':'alt full')+'</div>';
return hud([['ターン',s.round+'/'+(s.k==='I'?5:12)],['敵',s.enemies.filter(p=>p.hp>0).length],['操作',h.name]])+(s.phase!=='play'?'<div class="result"><h2>'+(s.phase==='win'?'作戦成功':'作戦失敗')+'</h2><p>'+s.log[0]+'</p>'+(s.k==='F'?btn('帰還・次の作戦へ','finish',false,'full'):'')+'</div>':'')+'<div class="panel"><h3>'+(s.k==='I'?'村の防衛':s.k==='F'?'第'+s.chapter+'作戦':'辺境の砦')+'</h3><small>緑：移動　赤：攻撃　'+(s.k==='I'?'橙：予告攻撃':'▥：遮蔽物')+'</small><div class="grid">'+tiles+'</div><div class="three">'+s.heroes.map((p,i)=>btn(p.name+'<br>'+E.jobs[p.job]+hp(p.hp,p.max)+'HP '+p.hp+'/'+p.max+' · '+p.ap+'AP','select:'+i,p.hp<=0||s.phase!=='play'||(s.k==='M'&&i!==0),s.active===i?'sel':'alt')).join('')+'</div>'+btn(s.k==='M'?'仲間と敵のターンへ':'敵ターンへ','end',s.phase!=='play','full')+'</div>'+extra}
function render(){$('nav').innerHTML=keys.map((k,i)=>btn('<b>'+String(i+1).padStart(2,'0')+'</b>'+E.modes[k][0],'mode:'+k,false,k===mode?'sel':'alt')).join('');let s=states[mode],c=E.modes[mode];$('view').innerHTML='<div class="kicker">'+c[2]+'</div><h2>'+c[1]+'</h2><p class="muted">'+c[3]+'</p>'+(s.stage==='battle'?battle(s):prep(s))+'<div class="panel"><h3>戦況記録</h3><div class="log">'+s.log.join('\n')+'</div></div>';if(P)document.querySelectorAll('canvas[data-name]').forEach(c=>{let j=Number(c.dataset.job);P.draw(c,P.make(c.dataset.name,{species:'human',job:['guard','ranger','mage'][j],weapon:['sword','bow','staff'][j],armor:['plate','leather','robe'][j]}),2)})}
document.addEventListener('click',ev=>{let b=ev.target.closest('button[data-a]');if(!b||b.disabled)return;let [a,i,j]=b.dataset.a.split(':'),s=states[mode],n=Number(i);if(a==='mode'){mode=i;slot=0;pushing=false}else if(a==='reset'){states[mode]=E.init(mode);slot=0;pushing=false}else if(a==='slot')slot=n;else if(a==='assign')E.slot(s,slot,i);else if(a==='train')E.train(s,i);else if(a==='rest')E.rest(s);else if(a==='start')E.start(s);else if(a==='finish')E.finish(s);else if(a==='choice')E.choose(s,i);else if(a==='order'&&s.phase==='play'&&['援護','護衛','突撃'].includes(j))s.orders[n]=j;else if(a==='oath')E.oath(s);else if(a==='pushmode')pushing=!pushing;else if(a==='select'&&s.heroes[n].hp>0&&(mode!=='M'||n===0)){s.active=n;pushing=false}else if(a==='cell'){let p=E.at(s,n,Number(j));if(pushing&&p&&p.id[0]==='e'){if(E.push(s,n,Number(j)))pushing=false}else E.move(s,n,Number(j))}else if(a==='end'){E.end(s);pushing=false}render()});render();</script></body></html>
