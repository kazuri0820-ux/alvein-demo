function prep(s){return '<div class="panel"><h3>新世代を作る</h3><p>左で発動条件、右で効果を継承。同じ人物は選べない。</p><div class="parents">'+[0,1].map(n=>'<div><h3>'+ (n===0?'発動条件':'効果')+'</h3>'+E.lineage.map((p,i)=>b(p.name+'<br><small>'+p.desc.split(' → ')[n]+'</small>','parent:'+n+':'+i,false,pair[n]===i?'sel full':'alt full')).join('')+'</div>').join('')+'</div><div class="panel"><h3>新能力</h3><p>'+E.lineage[pair[0]].desc.split(' → ')[0]+' → '+E.lineage[pair[1]].desc.split(' → ')[1]+'</p>'+b('継承者を誕生させて出撃','breed',pair[0]===pair[1],'full')+'</div></div>'}
function battle(s){let h=s.heroes[s.active],tiles='',c=E.cards[s.hand[card]],hint=[];if(mode==='P'&&h.hp>0&&h.ap>0){for(let e of s.enemies.filter(e=>e.hp>0&&E.dist(e,h)===1)){hint=hint.concat(E.trace(s,h,e,e.x-h.x,e.y-h.y).visited)}}let path=mode==='T'?E.route(s,s.gate,s.castle,false)||[]:[];
for(let y=0;y<E.H;y++)for(let x=0;x<E.W;x++){let p=E.at(s,x,y),w=E.wall(s,x,y),build=s.builds.find(b=>b.x===x&&b.y===y),r=E.route(s,h,{x,y}),enemy=p&&p.id.startsWith('e'),move=E.free(s,x,y)&&r&&r.length<=3&&r.length>0&&(mode==='D'?c?.type==='move'&&s.energy>=c.cost:h.ap>0),attack=enemy&&(mode==='D'?c?.type==='attack'&&E.dist(h,p)<=(s.hand[card]==='slash'?1:s.hand[card]==='arrow'?4:3)&&E.los(s,h,p):mode==='P'?E.dist(h,p)===1&&h.ap>0:E.dist(h,p)<=h.range&&E.los(s,h,p)&&h.ap>0);
let cls='tile'+(w?' wall':'')+(move?' reach':'')+(attack?' target':'')+(p===h?' selected':'')+(hint.some(q=>q[0]===x&&q[1]===y)?' ricochet':'')+(path.some(q=>q[0]===x&&q[1]===y)?' route':'');
let t=p?(enemy?'<span class="foe">♞</span><small>'+p.hp+'HP</small>':portrait(p)+'<small>'+p.hp+'HP</small>'):build?({wall:'▥',tower:'♜',trap:'✧'}[build.type]):mode==='T'&&s.gate.x===x&&s.gate.y===y?'▼':mode==='T'&&s.castle.x===x&&s.castle.y===y?'♛':w?'':'·';tiles+=b(t,'cell:'+x+':'+y,s.phase!=='play',cls)}
let extra='';if(mode==='D')extra='<div class="panel"><h3>手札 · 行動力 '+s.energy+'/3</h3><p class="stat">騎士を選択 → カード → 対象マス。防御・回復などは選ぶと即時発動。</p><div class="hand">'+s.hand.map((id,i)=>{let c=E.cards[id];return b('<span class="cost">'+c.cost+'</span><b>'+c.name+'</b><small>'+c.desc+'</small>','card:'+i,s.energy<c.cost||s.phase!=='play',card===i?'sel':'alt')}).join('')+'</div><small>山札 '+s.deck.length+' · 捨札 '+s.discard.length+' · 攻撃回数 '+s.attacks+'</small></div>';
if(mode==='P')extra='<div class="panel"><h3>連鎖 '+s.combo+' / 最高 '+s.best+'</h3><p>隣接した敵をタップすると弾き飛ばす。弓兵は右90°、術師は左90°、盾衛と壁は反射。紫のマスは予測経路（敵が倒れると短縮）。</p></div>';
if(mode==='G')extra='<div class="panel"><h3>継承能力</h3><p>'+E.lineage[pair[0]].desc.split(' → ')[0]+' → '+E.lineage[pair[1]].desc.split(' → ')[1]+' · 発動 '+s.heritage+'回</p></div>';
if(mode==='T')extra='<div class="panel"><h3>建築 · 資金 '+s.gold+'G</h3><div class="acts">'+[['wall','壁 2G'],['tower','砲塔 4G'],['trap','罠 2G']].map(([id,n])=>b(n,'tool:'+id,s.gold<E.cost[id]||s.phase!=='play',tool===id?'sel':'alt')).join('')+b('騎士操作','tool:none',false,tool?'alt':'sel')+'</div><small>選択して空きマスをタップ。橙の線は敵の進軍経路。完全封鎖は不可。</small></div>';
return hud(mode==='D'?[['ターン',s.round+'/12'],['行動力',s.energy],['敵',s.enemies.filter(e=>e.hp>0).length]]:mode==='T'?[['波',Math.min(3,s.wave)+'/3'],['城HP',s.base],['資金',s.gold]]:mode==='P'?[['ターン',s.round+'/12'],['連鎖',s.best],['敵',s.enemies.filter(e=>e.hp>0).length]]:[['戦闘',s.stage+'/2'],['ターン',s.round],['能力発動',s.heritage]])+(s.phase!=='play'?'<div class="result"><h2>'+(s.phase==='win'?'作戦成功':'作戦失敗')+'</h2><p>'+s.log[0]+'</p>'+(mode==='G'&&s.phase==='win'&&s.stage===1?b('第二戦へ','next',false,'full'):'')+'</div>':'')+'<div class="panel board"><div class="row"><h3>戦場</h3><small>緑：移動　赤：攻撃</small></div><div class="grid seven">'+tiles+'</div><div class="three">'+s.heroes.map((p,i)=>b(p.name+hp(p)+'HP '+p.hp+(mode==='D'?'':' · '+p.ap+'AP'),'hero:'+i,p.hp<=0||s.phase!=='play',i===s.active?'sel':'alt')).join('')+'</div>'+b(mode==='T'?'敵の進軍・砲塔攻撃':'ターン終了', 'end',s.phase!=='play','full')+'</div>'+extra}
function render(){$('nav').innerHTML=keys.map((k,i)=>b('<b>0'+(i+1)+'</b>'+E.modes[k][0],'mode:'+k,false,mode===k?'sel':'alt')).join('');let s=states[mode],m=E.modes[mode];$('view').innerHTML='<div class="kicker">TACTICAL FUSION / '+mode+'</div><h2>'+m[1]+'</h2><p class="muted">'+m[2]+'</p>'+(s.phase==='prep'?prep(s):battle(s))+'<div class="panel"><h3>戦況記録</h3><div class="log">'+s.log.join('\n')+'</div></div>';if(P)document.querySelectorAll('canvas[data-name]').forEach(c=>{let j=+c.dataset.job;P.draw(c,P.make(c.dataset.name,{species:'human',job:['guard','ranger','mage'][j],weapon:['sword','bow','staff'][j],armor:['plate','leather','robe'][j]}),2)})}
document.addEventListener('click',ev=>{let z=ev.target.closest('button[data-a]');if(!z||z.disabled)return;let [a,i,j]=z.dataset.a.split(':'),s=states[mode],n=+i;if(a==='mode'){mode=i;card=-1;tool=''}else if(a==='reset'){states[mode]=E.init(mode);card=-1;tool='';if(mode==='G')pair=[0,1]}else if(a==='parent')pair[n]=+j;else if(a==='breed')E.breed(s,...pair);else if(a==='hero'){s.active=n;tool=''}else if(a==='card'){card=n;let c=E.cards[s.hand[n]];if(c?.type==='self'){E.deckAct(s,n,s.heroes[s.active].x,s.heroes[s.active].y);card=-1}}else if(a==='tool')tool=i==='none'?'':i;else if(a==='next')E.nextGene(s);else if(a==='end'){E.end(s);card=-1}else if(a==='cell'){let p=E.at(s,n,+j);if(tool&&mode==='T'){E.build(s,tool,n,+j)}else if(p&&!p.id.startsWith('e')){s.active=s.heroes.indexOf(p)}else if(mode==='D'){if(E.deckAct(s,card,n,+j))card=-1}else if(mode==='P'&&p)E.launch(s,n,+j);else E.basic(s,n,+j)}render()});render();</script></body></html>
