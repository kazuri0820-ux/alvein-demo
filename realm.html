<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>諸境の人物録</title><style>*{box-sizing:border-box}body{background:#211e22;color:#f1e1c7;font:16px system-ui;margin:0}main{max-width:630px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{font:600 26px serif}h2{font:600 19px serif;margin:20px 0 8px}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}article{text-align:center;background:#342b2d;padding:8px 0 0;border-bottom:2px solid #77594b}canvas{display:block;width:100%;max-width:100px;height:auto;margin:auto;image-rendering:pixelated}strong{display:block;font:600 14px serif;min-height:35px}a{color:#edd7b3}article a{display:block;padding:8px 0;min-height:40px;font-size:14px}small{color:#c0a898}nav{line-height:2}.rare{background:radial-gradient(ellipse at 50% 38%,#423850,#24202d 72%);border:1px solid #9a8050}.rare strong{color:#ffe8a7}</style><main><header><h1>諸境の人物録</h1><a href="./deck-destiny.html?studio">影絵工房へ</a></header><small>第五〜十五集・849体　 <a href="./folio.html?volume=1">第一集</a>　<a href="./folio.html?volume=2">第二集</a>　<a href="./folio.html?volume=3">第三集</a></small><nav><a href="?v=5">潮路の岬</a>　<a href="?v=6">銅嶺の山道</a>　<a href="?v=7">月川の灯市</a>　<a href="?v=8">葦原の渡り宿</a>　<a href="?v=9">白砂の隊商路</a>　<a href="?v=10">星祀りの百霊</a>　<a href="?v=11">朝霧の橋</a>　<a href="?v=12">翠葉の庭</a>　<a href="?v=13">琥珀の宿</a>　<a href="?v=14">藍染の里</a>　<a href="?v=15">夕凪の港</a></nav><div id="list"></div></main><script src="./deck-core.js"></script><script src="./realm.js?v=2"></script><script>
const k=Math.max(0,Math.min(10,(Number(new URLSearchParams(location.search).get('v'))||5)-5))|0;
Realm.load(k).then(()=>{const h=document.createElement('h2'),s=document.createElement('section');h.textContent=Realm.titles[k]+'・'+Array.from({length:100},(_,j)=>k*100+j).filter(i=>!Realm.retired.has(i)).length+'体';list.append(h,s);for(let j=0;j<100;j++){const i=k*100+j;if(Realm.retired.has(i))continue;const [n,p]=Realm.entry(i),a=document.createElement('article');a.innerHTML='<canvas></canvas><strong>'+Realm.name(i)+'</strong><a href="./deck-destiny.html?studio='+n+'&pick='+p+'&realm='+i+'">試戦</a><a href="./deck-destiny.html?recruits=1&invite='+n+'-'+p+'&realm='+i+'">招く</a>';if(k===5)a.className="rare";s.append(a);Realm.draw(a.firstChild,i)}});</script></html>
