<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>残火の城｜戦士名鑑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211e22;color:#efe2cb;font:15px system-ui}main{max-width:660px;margin:auto;padding:18px 14px 50px}header,nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}header{border-bottom:1px solid #6d5447}h1,h2,strong{font-family:serif}h1{font-size:25px}h2{font-size:20px}a{color:#f4d6a6;text-underline-offset:3px}nav{margin-top:15px;flex-wrap:wrap}select{background:#31282a;color:#fff1df;font:inherit;border:1px solid #846d58;padding:10px}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}article{min-width:0;background:#372f30;border-bottom:2px solid #83604e;text-align:center;padding:7px 2px 2px}article.rare{background:radial-gradient(at 50% 30%,#534759,#29222c 75%);border:1px solid #ad905e}canvas{display:block;width:100%;max-width:112px;margin:auto;image-rendering:pixelated}strong{display:block;min-height:2.4em;align-content:center;overflow-wrap:anywhere;font-size:15px}.role{display:block;color:#d5c1ac;font-size:12px}.actions{justify-content:center;gap:0}.actions a{display:grid;place-items:center;min-height:44px;min-width:43px;font-size:13px}footer{text-align:center;margin-top:20px}.rare strong{color:#ffdf9b}
</style><main><header><h1>残火の城 戦士名鑑</h1><a href="./deck-destiny.html?studio">影絵工房</a></header><nav><label>部隊 <select id="unit"></select></label><a id="rare" href="?v=10">レア・残火の百傑</a></nav><h2 id="heading"></h2><section id="list"></section><footer><a href="./deck-destiny.html?recruits=1">本編の編成へ</a></footer></main>
<script src="./deck-core.js"></script><script src="./fighters.js?v=1"></script><script>
const chapters=['城門守備隊','東街道の先鋒','白砂の遠征隊','渡河の援軍','朱門の近衛','雪嶺の斥候','海峡の遊撃隊','城塞の守り手','夜明けの旗手','残火の百傑'];
const book=Math.max(0,Math.min(9,Math.floor(Number(new URLSearchParams(location.search).get('v'))||1)-1));
const unit=document.getElementById('unit');chapters.forEach((title,i)=>unit.add(new Option(title,i+1,false,i===book)));unit.onchange=()=>location.search='?v='+unit.value;
document.getElementById('heading').textContent=chapters[book]+'　100名';
for(let id=book*100;id<(book+1)*100;id++){
 const [seed,pick]=Fighters.entry(id),a=document.createElement('article');
 if(book===9)a.className='rare';
 a.innerHTML='<canvas></canvas><strong>'+Fighters.name(id)+'</strong><span class="role">'+AlveinDeck.roles[+Fighters.roles[id]].name+'</span><div class="actions"><a href="./deck-destiny.html?studio='+seed+'&pick='+pick+'&fighter='+id+'">試戦</a><a href="./deck-destiny.html?recruits=1&invite='+seed+'-'+pick+'&fighter='+id+'">招く</a></div>';
 document.getElementById('list').append(a);Fighters.draw(a.firstChild,id);
}
</script></html>
