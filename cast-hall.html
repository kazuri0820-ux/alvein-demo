<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#201f24"><title>残火の城｜弓兵の招集</title><style>
*{box-sizing:border-box}body{margin:0;background:#17181d;color:#f8ecd8;font:16px system-ui,sans-serif}main{max-width:490px;margin:auto;padding:14px 16px 24px}header,nav,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}header{margin-bottom:12px}h1,h2{font-family:serif;margin:0}h1{font-size:21px}a{color:inherit}header a{font-size:14px}.plate{--accent:#cf8841;position:relative;isolation:isolate;overflow:hidden;height:clamp(290px,47svh,470px);background:radial-gradient(ellipse at 58% 20%,color-mix(in srgb,var(--accent) 55%,#413438),#26252c 79%);border:1px solid #806b58;border-radius:3px}.plate:before{content:'';position:absolute;width:80%;aspect-ratio:1;border:1px solid #dfcba33b;outline:5px double #d7bd8d24;transform:rotate(24deg);left:28%;top:20%}.plate canvas{position:absolute;right:3%;height:97%;bottom:0}.caption{position:absolute;bottom:0;left:0;right:0;padding:39px 14px 12px;background:linear-gradient(transparent,#19191edc)}h2{font-size:32px}.caption small{color:#e3cba3;letter-spacing:.15em}nav{margin:10px 0}button{flex:1;min-height:56px;border:1px solid #524b47;border-radius:3px;color:#dbcdb9;background:#28282d;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#e2bb80;background:#493b30;color:#fff1d9}.info{padding:4px 2px 12px}.info p{margin:5px 0 9px;line-height:1.6}.card{font-size:14px;color:#e7c797}footer a{flex:1;text-align:center;text-decoration:none;padding:13px 2px;border:1px solid #77644d;border-radius:3px}footer a:last-child{background:#ddbf8c;color:#252126;font-weight:bold}
</style><main><header><h1>残火の城　弓兵の招集</h1><a href="./deck-destiny.html?studio">工房へ</a></header><div class="plate"><canvas id="art" aria-label="生成された志願者の全身"></canvas><div class="caption"><small id="job"></small><h2 id="who"></h2></div></div><button id="refresh" style="width:100%;margin-top:8px;min-height:44px">新しい3人を募集する</button><nav aria-label="志願者"></nav><div class="info"><p id="bio"></p><div class="card" id="card"></div></div><footer><a id="try">試戦する</a><a id="hire">本編に招く</a></footer></main><script src="./recruit-sprites.js"></script><script src="./recruit-foundry.js"></script><script src="./deck-core.js"></script><script>
const F=RecruitFoundry,id=s=>document.getElementById(s),q=new URLSearchParams(location.search);
const fresh=()=>crypto.getRandomValues(new Uint32Array(1))[0];
let seed=/^\d{1,10}$/.test(q.get('seed')||'')?Number(q.get('seed'))>>>0:fresh(),crew=[];
function populate(index){crew=[];for(let i=0;i<3;i++)crew.push(F.batch(seed,i,crew));const nav=document.querySelector('nav');nav.replaceChildren();crew.forEach(({p},i)=>{const b=document.createElement('button');b.textContent=p.name;b.onclick=()=>show(i);nav.append(b)});show(index)}
function show(i){const {p,b,i:pick}=crew[i];F.draw(id('art'),p.emberLook);id('who').textContent=p.name;id('job').textContent=p.origin+'出身の弓兵';id('bio').textContent='天賦「'+AlveinDeck.talents[p.talent].name+'」　'+AlveinDeck.talents[p.talent].desc;id('card').textContent='初期札「'+AlveinDeck.cards[p.deck[0]][0]+'」 ／ 固有札「'+AlveinDeck.cards[p.signature][0]+'」';document.querySelectorAll('nav button').forEach((e,j)=>e.setAttribute('aria-pressed',String(i===j)));id('try').href='./deck-destiny.html?studio='+b+'&pick='+pick+'&ember=732';id('hire').href='./deck-destiny.html?recruits=1&invite='+b+'-'+pick+'&ember=732';history.replaceState(null,'','?seed='+seed+'&pick='+i)}
id('refresh').onclick=()=>{seed=fresh();populate(0)};F.ready.then(()=>populate(Math.min(2,Math.max(0,Number(q.get('pick'))|0))));
</script></html>
