<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#201f24"><title>残火の城｜弓兵の招集</title><style>
*{box-sizing:border-box}body{margin:0;background:#17181d;color:#f8ecd8;font:16px system-ui,sans-serif}main{max-width:490px;margin:auto;padding:14px 16px 24px}header,nav,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}header{margin-bottom:12px}h1,h2{font-family:serif;margin:0}h1{font-size:21px}a{color:inherit}header a{font-size:14px}.plate{--accent:#cf8841;position:relative;isolation:isolate;overflow:hidden;height:clamp(290px,47svh,470px);background:radial-gradient(ellipse at 58% 20%,color-mix(in srgb,var(--accent) 55%,#413438),#26252c 79%);border:1px solid #806b58;border-radius:3px}.plate:before{content:'';position:absolute;width:80%;aspect-ratio:1;border:1px solid #dfcba33b;outline:5px double #d7bd8d24;transform:rotate(24deg);left:28%;top:20%}.plate img{position:absolute;right:3%;height:97%;bottom:0}.caption{position:absolute;bottom:0;left:0;right:0;padding:39px 14px 12px;background:linear-gradient(transparent,#19191edc)}h2{font-size:32px}.caption small{color:#e3cba3;letter-spacing:.15em}nav{margin:10px 0}button{flex:1;min-height:56px;border:1px solid #524b47;border-radius:3px;color:#dbcdb9;background:#28282d;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#e2bb80;background:#493b30;color:#fff1d9}.info{padding:4px 2px 12px}.info p{margin:5px 0 9px;line-height:1.6}.card{font-size:14px;color:#e7c797}footer a{flex:1;text-align:center;text-decoration:none;padding:13px 2px;border:1px solid #77644d;border-radius:3px}footer a:last-child{background:#ddbf8c;color:#252126;font-weight:bold}
</style><main><header><h1>残火の城　弓兵の招集</h1><a href="./deck-destiny.html?studio">工房へ</a></header><div class="plate"><img id="art" alt=""><div class="caption"><small id="job"></small><h2 id="who"></h2></div></div><nav aria-label="志願者"></nav><div class="info"><p id="bio"></p><div class="card" id="card"></div></div><footer><a id="try">試戦する</a><a id="hire">本編に招く</a></footer></main><script src="./cast-art.js"></script><script src="./deck-core.js"></script><script>
const people=[
 ['ナギ','水鐘楼の救難士','水没した鐘楼に、今も夜ごと灯をともす。差し伸べた手の先には、いつも引き上げ用の綱がある。','守り','#c48745'],
 ['イゼル','焼門の守弓','陥落した門の鍵を預かる最後の番兵。門を通った敵は一人残らず覚えている。','狩人の印','#56768a'],
 ['ルカ','灰果園の走り使い','灰に埋もれた果樹園を駆け抜ける。赤い道糸が揺れる頃には、伝令はもう次の屋根にいる。','速射','#aa505e']
];
const id=s=>document.getElementById(s),buttons=people.map((p,i)=>{const b=document.createElement('button');b.textContent=p[0];b.onclick=()=>show(i);document.querySelector('nav').append(b);return b});
function show(i){const p=people[i];id('art').src=CastArt[i];id('art').alt=p[0]+'の全身立ち絵';id('who').textContent=p[0];id('job').textContent=p[1];id('bio').textContent=p[2];id('card').textContent='初期デッキ　'+p[3]+'　／　'+Object.values(AlveinDeck.cards).find(c=>c[0]===p[3])[4];document.querySelector('.plate').style.setProperty('--accent',p[4]);buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));
 let batch=400100+i,pick=-1;while(pick<0){pick=AlveinDeck.init(batch).offers.findIndex(c=>c.role===2);if(pick<0)batch+=3}
 id('try').href='./deck-destiny.html?studio='+batch+'&pick='+pick+'&ember='+(729+i);id('hire').href='./deck-destiny.html?recruits=1&invite='+batch+'-'+pick+'&ember='+(729+i);history.replaceState(null,'','?hero='+i)}
show(Math.min(2,Math.max(0,Number(new URLSearchParams(location.search).get('hero'))|0)));
</script></html>
