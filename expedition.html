<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>アルヴェイン遠征記 | 王国と英雄</title><style>
*{box-sizing:border-box}body{margin:0;background:#151914;color:#e9dfc7;font:14px/1.5 system-ui,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}button:disabled{opacity:.35;cursor:default}#app{max-width:580px;margin:auto;min-height:100dvh;padding:14px 12px calc(90px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at top,#363a2d,#1d251c 48%,#141914)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #82714b;padding:8px 0 12px}h1,h2,h3{font-family:Georgia,"Yu Mincho",serif;color:#f2d69d;margin:0}h1{font-size:22px;letter-spacing:.04em}h2{font-size:21px}h3{font-size:15px}.eyebrow{color:#baaa85;font-size:10px;letter-spacing:.16em}.muted,small{color:#b8b39d}.version{font-size:10px;color:#c3b18b}.wallet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.wallet div{background:#252d23;border:1px solid #5c553d;padding:9px;border-radius:5px}.wallet small{display:block;font-size:10px}.wallet b{font-size:22px;color:#f3ce84;font-variant-numeric:tabular-nums}.panel{background:linear-gradient(130deg,#30382a,#242c23);border:1px solid #736446;border-radius:7px;margin:10px 0;padding:13px}.hero{padding:0;overflow:hidden}.hero canvas,#field{width:100%;display:block;image-rendering:pixelated}.hero-copy{padding:14px}.primary,.secondary,.tiny{border:1px solid #ab8a4e;border-radius:5px;background:linear-gradient(#826537,#514121);min-height:46px;padding:10px 12px;font-weight:700}.primary{width:100%;color:#fff1cc;margin-top:12px}.secondary{background:#333b2d;border-color:#71694d}.tiny{min-height:44px;font-size:12px;padding:6px 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.roster{display:grid;gap:8px}.person{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:#232d24;border:1px solid #665a40;border-radius:6px;padding:8px}.portrait{width:54px;height:72px;image-rendering:pixelated;background:radial-gradient(#5a5641,#20251f);border:1px solid #8b794f}.person b{color:#f0d39a}.person p{margin:2px 0;font-size:11px;color:#c7c0ac}.stats{font-size:11px;color:#d6caa9;display:flex;flex-wrap:wrap;gap:8px}.trait{color:#a9d1a1!important}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.slot{min-width:0;text-align:center;border:1px solid #6a5d43;background:#222a21;border-radius:5px;padding:8px 3px;min-height:100px}.slot canvas{width:42px;height:56px;image-rendering:pixelated}.slot b{display:block;font-size:12px}.slot small{font-size:10px}.slot.selected{border-color:#efc77e;background:#514629}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:580px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:#191e18;border-top:1px solid #8b7549;padding:7px 8px calc(7px + env(safe-area-inset-bottom));gap:6px;z-index:5}.nav button{border:0;background:transparent;min-height:48px;color:#b9b29c;font-size:12px}.nav button.active{background:#3f3b28;color:#ffe2a2;border-radius:5px}.nav span{display:block;font-size:18px}.bar{height:8px;background:#111a13;border-radius:2px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:#91b178}.bar.enemy i{background:#cd765d}.party{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fighter{background:#20291e;border:1px solid #59563e;padding:7px;font-size:10px;min-width:0}.fighter b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.log{height:90px;overflow:hidden;font-size:11px;color:#c9c6ad;white-space:pre-line}.battle{padding:0;overflow:hidden}.battleinfo{padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{min-height:49px}.tag{color:#dfc17e;font-size:11px}.hint{font-size:12px;color:#c7c5a9}.notice{color:#f2cb80;font-size:12px}.summary{padding:20px;text-align:center}.old{display:block;color:#c2b493;text-align:center;font-size:11px;margin-top:16px}
</style></head><body><main id="app"><header><div><div class="eyebrow">ALVEIN · CHRONICLE OF THE REALM</div><h1>アルヴェイン遠征記</h1></div><span class="version">0.4.0<br>再構築試作</span></header><div class="wallet"><div><small>募集令</small><b id="crowns"></b></div><div><small>永続勲章</small><b id="medals"></b></div><div><small>最深区画</small><b id="record"></b></div></div><div id="notice" class="notice"></div><div id="screen"></div><a class="old" href="./index.html">旧版 0.3.0 を開く（別セーブ）</a></main><nav class="nav"><button data-tab="castle"><span>♜</span>王国</button><button data-tab="roster"><span>♟</span>人物・編成</button><button data-tab="battle"><span>⚔</span>遠征</button></nav><script src="./pixel-engine.js"></script><script src="./expedition-core.js"></script><script>
'use strict';
const E=AlveinExpedition,P=AlveinPixelEngine,K='alvein-expedition-v1';let s,storage=true,notice='',tab='castle',slot=0,pace=1,auto=false,last=0,flash=0;const $=id=>document.getElementById(id);
try{const raw=localStorage.getItem(K);if(raw){try{s=JSON.parse(raw);if(!E.valid(s))throw Error();}catch(e){storage=false;notice='試作版セーブに異常があるため、上書きせず一時プレイします。';}}}catch(e){storage=false;notice='保存不可：一時プレイになります。'}if(!E.valid(s))s=E.initial();if(s.run)tab='battle';
const save=()=>{if(storage)try{localStorage.setItem(K,JSON.stringify(s))}catch(e){storage=false;notice='保存できません。';}};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const by=id=>s.roster.find(p=>p.id===id),cache=new Map();
function sprite(p){const k=p.id+':'+p.role;if(!cache.has(k)){const r=E.roles[p.role];cache.set(k,P.make(s.seed+':'+p.id,{species:'human',job:r.job,weapon:r.weapon,armor:r.armor}))}return cache.get(k)}
function card(p,action,label,disabled){const v=E.stats(s,p);return '<article class="person"><canvas class="portrait" data-person="'+p.id+'"></canvas><div><b>'+esc(p.name)+'</b> <small>'+E.roles[p.role].name+'</small><p class="trait">'+E.traits[p.trait][0]+' · '+E.traits[p.trait][1]+'</p><div class="stats"><span>HP '+v.hp+'</span><span>攻 '+v.atk+'</span><span>守 '+v.def+'</span>'+(v.heal?'回 '+v.heal:'')+'</div><p>'+esc(p.origin)+'出身 · '+esc(p.reason)+'</p></div><button class="tiny" data-action="'+action+'" data-id="'+p.id+'" '+(disabled?'disabled':'')+'>'+label+'</button></article>'}
function bar(h,m,enemy=false){return '<div class="bar '+(enemy?'enemy':'')+'"><i style="width:'+Math.max(0,Math.min(100,h/m*100))+'%"></i></div>'}
function world(c,t,battle){const x=c.getContext('2d'),w=c.width=320,h=c.height=160;const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#293f40');g.addColorStop(.65,'#85917a');g.addColorStop(1,'#d7b981');x.fillStyle=g;x.fillRect(0,0,w,h);const rect=(a,b,d,e,f)=>{x.fillStyle=f;x.fillRect(Math.round(a),Math.round(b),d,e)};rect(246,18,20,20,'#f4dba5');for(let j=0;j<3;j++){x.fillStyle=['#657b69','#435e50','#344b3b'][j];x.beginPath();x.moveTo(0,110);for(let i=0;i<=8;i++)x.lineTo(i*42,50+j*19+Math.sin(i*2+j)*19);x.lineTo(320,160);x.lineTo(0,160);x.fill()}rect(0,120,320,40,'#3e4e32');rect(0,132,320,17,'#827356');for(let i=0;i<23;i++)rect((i*43)%320,135+i%7,8,1,'#b09c71');for(let i=0;i<10;i++){let a=i*39-8;rect(a,86,5,43,'#453f2c');rect(a-10,74,25,18,'#3e523c');rect(a-15,87,34,12,'#344b35')}
if(!battle){for(let i=0;i<3;i++){let a=125+i*33;rect(a,67-i%2*12,28,65+i%2*12,'#b2a387');for(let k=0;k<3;k++)rect(a+k*10,61-i%2*12,7,8,'#b2a387');rect(a+11,87,5,14,'#48504a')}rect(150,105,18,27,'#4b4232');rect(170,44,2,30,'#c1a172');rect(172,44,19,9,'#a95d4e');return}
const r=s.run;if(!r)return;for(let i=0;i<r.party.length;i++){const u=r.party[i],p=by(u.id);if(u.hp<=0)continue;P.render(x,sprite(p),93-i*32+(flash>t?Math.sin(t/40+i)*4:0),98,1)}const e=E.enemy(r.stage);const a=244+(flash>t?Math.sin(t/35)*2:0);rect(a-5,135,48,3,'#2c3025');if(e.kind==='beast'){rect(a,111,30,17,'#755a4d');rect(a+24,104,13,13,'#755a4d');rect(a+26,99,4,8,'#ac8870');rect(a+5,126,4,9,'#392f29');rect(a+24,126,4,9,'#392f29');rect(a+33,108,3,3,'#f4ca81')}else if(e.kind==='armor'){rect(a+7,99,25,34,'#66736e');rect(a+3,105,8,21,'#9a9d88');rect(a+27,105,9,22,'#a6a28e');rect(a+12,91,14,13,'#838a7d');rect(a+15,96,3,3,'#f2c778');rect(a+23,96,3,3,'#f2c778')}else{rect(a+12,98,17,29,'#7eaa90');rect(a+7,109,27,10,'#a7c6a5');rect(a+16,105,3,3,'#f8ecc5');rect(a+24,105,3,3,'#f8ecc5')}if(flash>t){rect(166,112,15,2,'#ffe6a6');rect(224,108,10,2,'#fff2ca');rect(228,104,2,10,'#fff2ca')}}
function render(){ $('crowns').textContent=s.crowns;$('medals').textContent=s.medals;$('record').textContent=s.record;$('notice').textContent=notice;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';
if(tab==='castle'){h='<section class="panel hero"><canvas id="castleArt"></canvas><div class="hero-copy"><div class="eyebrow">王国暦 108年 · 北方辺境</div><h2>王国の執務室</h2><p class="hint">英雄を迎え、部隊を組み、辺境へ。遠征で得た勲章が王国を強くする。</p><button class="primary" data-action="'+(s.run?'battle':'start')+'">'+(s.run?'遠征へ戻る':'遠征を開始する')+'</button></div></section><section class="panel"><div class="row"><div><h3>王国鍛冶場 Lv.'+(s.castle+1)+'</h3><small>全員のHP・攻撃力 +8% / Lv</small></div><button class="tiny" data-action="upgrade" '+(s.run||s.medals<1||s.castle>=30?'disabled':'')+'>勲章1で強化</button></div></section><section class="panel"><h3>遠征隊</h3><p>所属 '+s.roster.length+'名 · 帰還 '+s.runs+'回</p><button class="secondary" data-action="roster">人物と編成を見る</button></section>'}
if(tab==='roster'){h='<section class="panel"><div class="row"><h2>遠征部隊</h2><small>3人編成</small></div><p class="hint">左が前衛。枠を選び、下の人物を配置する。遠征中は固定。</p><div class="slots">'+s.slots.map((id,i)=>{const p=by(id);return '<button class="slot '+(i===slot?'selected':'')+'" data-action="slot" data-id="'+i+'"><small>'+['前衛','中衛','後衛'][i]+'</small><br><canvas data-person="'+id+'"></canvas><b>'+esc(p.name)+'</b><small>'+E.roles[p.role].name+'</small></button>'}).join('')+'</div></section><h3>所属人物 '+s.roster.length+'名</h3><div class="roster">'+s.roster.map(p=>card(p,'assign','配置',!!s.run||s.slots[slot]===p.id)).join('')+'</div><section class="panel"><div class="row"><h3>志願者</h3><span class="tag">募集令 1 / 人</span></div><p class="hint">同じ人物は再登場しない。能力・特性・役割を見比べよう。</p><div class="roster">'+s.offers.map(p=>card(p,'recruit','採用',!!s.run||s.crowns<1||s.roster.length>=60)).join('')+'</div></section>'}
if(tab==='battle'){const r=s.run;if(!r)h='<section class="panel summary"><h2>北方辺境遠征</h2><p>自動戦闘で進軍。負傷と敵の相性に注意しながら、帰還するタイミングを選ぼう。</p><button class="primary" data-action="start">出撃する</button></section>';else{const e=E.enemy(r.stage),rw=E.reward(s);h='<section class="panel battle"><div class="battleinfo"><div class="row"><b>第'+r.stage+'区画 · '+E.lands[Math.floor((r.stage-1)/5)%5]+'</b><span class="tag">'+(e.boss?'強敵':'自動進軍')+'</span></div></div><canvas id="field"></canvas><div class="battleinfo"><div class="row"><b>'+e.name+'</b><small>'+e.kind.replace('beast','獣').replace('armor','重装甲').replace('spirit','精霊')+' / HP '+r.enemyHp+' / '+e.hp+'</small></div>'+bar(r.enemyHp,e.hp,true)+'<div class="party">'+r.party.map(u=>'<div class="fighter"><b>'+esc(by(u.id).name)+'</b>'+bar(u.hp,u.max)+'HP '+u.hp+'/'+u.max+'</div>').join('')+'</div><p class="tag">討伐 '+r.kills+' · 金貨 '+r.gold+' · 鍛錬 Lv.'+r.boost+'</p><div class="actions"><button class="secondary" data-action="speed">速度 ×'+pace+'</button><button class="secondary" data-action="auto">'+(auto?'自動鍛錬 ON':'自動鍛錬 OFF')+'</button><button class="secondary" data-action="boost" '+(r.gold<12+r.boost*7||r.phase!=='fight'?'disabled':'')+'>鍛錬 '+(12+r.boost*7)+'G</button><button class="primary" style="margin:0" data-action="finish">'+(r.phase==='fight'?'帰還する':'帰還報酬を受取る')+'</button></div><p class="hint">帰還報酬：募集令 '+rw.crowns+' / 勲章 '+rw.medals+'</p><div class="log">'+r.events.map(esc).join('\n')+'</div>'+(r.phase!=='fight'?'<p class="notice">遠征終了。英雄たちは王国へ帰還できる。</p>':'')+'</div></section>'}}
$('screen').innerHTML=h;document.querySelectorAll('canvas[data-person]').forEach(c=>{const p=[...s.roster,...s.offers].find(x=>x.id===Number(c.dataset.person));if(p)P.draw(c,sprite(p),3)});if($('castleArt'))world($('castleArt'),0,false);if($('field'))world($('field'),performance.now(),true)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action,id=Number(b.dataset.id);if(b.dataset.tab)tab=b.dataset.tab;else if(a==='roster'||a==='battle')tab=a;else if(a==='slot')slot=id;else if(a==='assign')E.assign(s,slot,id);else if(a==='recruit')E.recruit(s,id);else if(a==='upgrade')E.upgrade(s);else if(a==='start'){E.start(s);tab='battle';last=performance.now()}else if(a==='boost')E.boost(s);else if(a==='finish'){const r=E.finish(s);if(r){notice='帰還：募集令 +'+r.crowns+' / 勲章 +'+r.medals;tab='castle'}}else if(a==='speed')pace=pace===1?2:1;else if(a==='auto')auto=!auto;save();render()});
setInterval(()=>{if(document.hidden||!s.run||s.run.phase!=='fight')return;if(performance.now()-last<1400/pace)return;last=performance.now();if(auto)E.boost(s);E.step(s);flash=last+350;save();if(tab==='battle')render();else{$('record').textContent=s.record}},120);
function animate(t){if($('field'))world($('field'),t,true);requestAnimationFrame(animate)}render();requestAnimationFrame(animate);save();
</script></body></html>
