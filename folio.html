<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>残火の人物録</title><style>*{box-sizing:border-box}body{background:#211e22;color:#f1e1c7;font:16px system-ui;margin:0}main{max-width:630px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{font:600 26px serif}h2{font:600 19px serif;margin:20px 0 8px}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}article{text-align:center;background:#342b2d;padding:8px 0 0;border-bottom:2px solid #77594b}canvas{display:block;width:100%;max-width:100px;height:auto;margin:auto;image-rendering:pixelated}strong{display:block;font:600 14px serif;min-height:35px}a{color:#edd7b3}article a{display:block;padding:8px 0;min-height:40px;font-size:14px}small{color:#c0a898}</style><main><header><h1>残火の人物録</h1><a href="./deck-destiny.html?studio">影絵工房へ</a></header><small>全32人　 <a href="?volume=1">第一集</a>　<a href="?volume=2">第二集</a></small><div id="list"></div></main><script src="./deck-core.js"></script><script src="./folio.js?v=2"></script><script>
const volume=new URLSearchParams(location.search).get("volume")==="1"?1:2;const refs=new Map();for(let n=volume===2?200000:0;refs.size<16;n++){AlveinDeck.init(n).offers.forEach((p,i)=>{if(!refs.has(Folio.key(p)))refs.set(Folio.key(p),[n,i])})}
Folio.ready(()=>AlveinDeck.roles.forEach((r,k)=>{const h=document.createElement('h2'),s=document.createElement('section');h.textContent=(volume===2?'第二集':'第一集')+' · '+r.name;list.append(h,s);for(let j=0;j<4;j++){const id=k*4+j,[n,i]=refs.get(id),a=document.createElement('article');a.innerHTML='<canvas></canvas><strong>'+Folio.names[id+16*(volume-1)]+'</strong><a href="./deck-destiny.html?studio='+n+'&pick='+i+'&folio='+volume+'">試戦</a><a href="./deck-destiny.html?recruits=1&invite='+n+'-'+i+'&folio='+volume+'">招く</a>';s.append(a);Folio.draw(a.firstChild,id+16*(volume-1))}}));
</script></html>
