<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弓兵の仕立室｜アルヴェイン</title><style>
*{box-sizing:border-box}body{margin:0;background:#201f22;color:#f3e8d6;font:16px system-ui,sans-serif}main{max-width:460px;margin:auto;padding:14px 18px 24px}header,.row,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font:600 24px serif;margin:8px 0}a{color:#e8d2b2}header a{font-size:14px}.stage{background:radial-gradient(ellipse at 50% 60%,#62605c,#3c3736 75%);border:1px solid #6a5c50;text-align:center;margin:6px 0 12px}.stage canvas{width:128px;height:160px;vertical-align:bottom;margin:12px auto;image-rendering:pixelated}fieldset{margin:0 0 8px;padding:3px 0;border:0}legend{color:#cfb89c;font:15px serif}button,footer a{min-height:44px;border:1px solid #645952;border-radius:3px;background:#363032;color:#f3e8d6;font:inherit;cursor:pointer;touch-action:manipulation}.row button{flex:1;font-size:14px}.row [aria-pressed=true]{background:#5d473b;border-color:#e5bd85}footer{margin-top:12px;flex-wrap:wrap}footer>*{flex:1;text-align:center;padding:10px 4px;white-space:nowrap}footer a:last-child{background:#6a4834}small{display:block;color:#c2b2a1;margin-top:10px}
</style><main><header><h1>弓兵の仕立室</h1><a href="./deck-destiny.html?studio">工房へ</a></header><div class="stage"><canvas id="preview" width="64" height="80" aria-label="組み合わせた弓兵"></canvas></div><section id="parts"></section><footer><button id="randomize">おまかせ</button><a id="trial">試戦</a><a id="invite">本編に招く</a></footer><small id="recipe"></small></main><script src="./archer-parts.js?v=1"></script><script src="./deck-core.js"></script><script>
const choices=[['頭部','老狩人','白髪混じりの衛士','赤毛の伝令'],['上半身と弓','苔色の外套','藍の肩掛け','灰の襟巻き'],['脚','旅の短靴','衛士の長靴','伝令の革靴']];
const byId=id=>document.getElementById(id);
const matches=new Map();
for(let batch=1;matches.size<27&&batch<=4096;batch++){
 AlveinDeck.init(batch).offers.forEach((p,i)=>{const k=p.appearanceSeed%27;if(p.role===2&&!matches.has(k))matches.set(k,[batch,i])});
}
let code=Number(new URLSearchParams(location.search).get('look'));if(!Number.isInteger(code)||code<0||code>26)code=0;
const rows=choices.map(([label,...names],layer)=>{
 const field=document.createElement('fieldset'),legend=document.createElement('legend'),row=document.createElement('div');legend.textContent=label;row.className='row';field.append(legend,row);byId('parts').append(field);
 return names.map((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>select(code+(i-Math.floor(code/3**layer)%3)*3**layer);row.append(b);return b});
});
function select(value){code=value;rows.forEach((row,l)=>row.forEach((b,i)=>b.setAttribute('aria-pressed',String(Math.floor(code/3**l)%3===i))));ArcherParts.draw(byId('preview'),code);const [batch,i]=matches.get(code);byId('trial').href='./deck-destiny.html?studio='+batch+'&pick='+i;byId('invite').href='./deck-destiny.html?recruits=1&invite='+batch+'-'+i;byId('recipe').textContent='仕立て番号 '+String(code+1).padStart(2,'0')+' ／ 27';history.replaceState(null,'','?look='+code)}
byId('randomize').onclick=()=>select((code+1+crypto.getRandomValues(new Uint32Array(1))[0]%26)%27);
ArcherParts.ready(()=>select(code));
</script></html>
