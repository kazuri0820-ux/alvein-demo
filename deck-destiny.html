<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>アルヴェイン 運命の手札</title><style>
:root{color-scheme:dark;--bg:#11151b;--surface:#1b222d;--bronze:#9f7b52;--gold:#f0cc94;--cream:#f7eedc;--muted:#b8b6b2;--line:#655440;--blue:#99c4e4;--rose:#ffc2aa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#242a38,#0d1015 65%);color:var(--cream);font:15px/1.5 system-ui,sans-serif}
main{max-width:530px;min-height:100vh;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 12px calc(70px + env(safe-area-inset-bottom));background:#131922;box-shadow:0 0 60px #0008}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;color:var(--gold)}
h1{font-size:20px;letter-spacing:.03em}
h2{font-size:24px}
h3{font-size:17px}
small,.muted,.stat{color:var(--muted)}
small,.stat{font-size:13px}
a{color:var(--blue)}
button{font:inherit;touch-action:manipulation;cursor:pointer;color:inherit;min-height:44px}
button:disabled{opacity:.56;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header,.row,.encounter,.hand-head,.round-footer{display:flex;justify-content:space-between;align-items:center;gap:8px}
header{min-height:54px;border-bottom:1px solid var(--line);padding:6px 0 8px}
header small{font-size:12px;white-space:nowrap}
.kicker{color:var(--gold);font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.13em}
.panel{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(140deg,#242a33,#181f28)}
.panel p{margin:5px 0}
.hud,.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.hud>div,.slot{border:1px solid #65543e;border-radius:6px;background:#202731;text-align:center;padding:6px}
.hud b,.slot b{display:block;color:var(--gold)}
.hud b{font-size:21px}
.slot canvas,.person canvas{display:block;width:48px;height:64px;margin:auto;image-rendering:pixelated}
.btn{border:1px solid #d2ab73;border-radius:6px;background:#ebc587;color:#201a14;font-weight:750;padding:7px 11px}
.btn.alt{border-color:#7e6b57;background:#232a34;color:var(--cream)}
.btn.sel,.btn.active{background:#573f32;color:#fff3dc;border-color:#e9be83}
.btn.full{width:100%;margin-top:6px}
.person{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.person>div:last-child{display:grid;gap:5px}
.person .btn{padding-inline:7px}
.deckmini{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.deckmini span,.choice{border:1px solid var(--line);border-radius:5px;padding:7px;margin-bottom:8px;background:#202833}
.tag,.link{color:var(--gold)}
.notice:not(:empty){border:1px solid #8c624d;padding:8px;margin:8px 0;color:var(--rose)}
.log{white-space:pre-line;font-size:13px;color:#ded4c5;text-align:left}
.nav{display:flex;gap:6px;position:fixed;z-index:2;bottom:0;left:50%;transform:translateX(-50%);max-width:530px;width:100%;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:#10161eee;border-top:1px solid var(--line)}
.nav button{flex:1;padding-inline:4px}
body[data-battle] nav{display:none}
body[data-battle] main{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.home-scene,.battle-scene{background:radial-gradient(ellipse at 54% 5%,#7c7e7f 0%,#47546a 19%,#252b42 45%,#161924 83%);background-image:linear-gradient(0deg,#10141c 0%,#11172400 68%),var(--scene,radial-gradient(ellipse at 50% 10%,#707d96,#222d46 48%,#151c2a));background-size:cover;background-position:center 45%;overflow:hidden}
.home-scene{margin:-12px -12px 0;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 14px;background-position:center 53%;text-shadow:0 2px 9px #000}
.home-scene h2{font-size:30px}
.experiment{display:block;margin:12px 0;text-align:center}
.encounter{padding:8px 0 6px}
.encounter h2{font-size:18px}
.encounter small{white-space:nowrap}
.battle-scene{border:1px solid #746049;border-radius:8px;padding:5px 5px 6px}
.enemygrid,.party-row,.hand,.previews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.enemy{background:linear-gradient(0deg,#171d27e8,#171d2788 59%,transparent);border:1px solid transparent;border-radius:6px;padding:4px 5px 6px;width:100%;display:grid;gap:2px;text-align:left;align-content:start}
.enemy.targetable{border-color:#e8a084;background-color:#341f23a6}
.enemy b,.hero b{font-size:14px;overflow-wrap:anywhere}
.enemy canvas{display:block;width:100%;height:54px;object-fit:contain;image-rendering:pixelated}
.hp{background:#361c25;border-radius:8px;height:5px;overflow:hidden;margin:1px 0}
.hp i{display:block;background:linear-gradient(90deg,#a04450,#e48374);height:100%;border-radius:inherit}
.intent{font-size:13px;color:var(--rose);font-weight:700}
.status{color:var(--blue);font-size:12px;min-height:18px}
.party-row,.hand{grid-template-columns:repeat(3,minmax(0,1fr))}
.party-row{margin:7px 0}
.hero{background:linear-gradient(145deg,#232d3a,#181e27);border:1px solid #615b54;border-radius:6px;padding:4px 5px;text-align:left;display:grid;gap:1px}
.hero.sel{border-color:#dcac72;box-shadow:inset 0 0 14px #b67e4340}
.hero.is-target{outline:1px dashed #e7a796;outline-offset:-3px}
.hero .hero-title{display:flex;align-items:center;gap:3px;min-width:0;height:30px}
.hero canvas{width:24px;height:32px;flex:none;image-rendering:pixelated}
.hero small{font-size:12px;letter-spacing:-.035em;white-space:nowrap}
.hero .energy{color:var(--gold)}
.hand-head{min-height:24px;margin:4px 0}
.hand-head small{font-size:12px}
.hand{grid-auto-rows:1fr}
.card{position:relative;display:grid;grid-template-rows:38px auto 1fr;grid-template-columns:minmax(0,1fr);align-items:start;gap:3px;padding:5px;text-align:left;border:1px solid #a28461;border-radius:7px;background:linear-gradient(150deg,#33303a,#211e26 66%);box-shadow:inset 0 0 0 2px #1a151d;min-height:108px}
.card[data-kind="魔法"],.card[data-kind="連携"]{--ink:#a6a4ec;background-color:#342c4c}
.card[data-kind="射撃"]{--ink:#9cc6a8}
.card[data-kind="防御"],.card[data-kind="回復"],.card[data-kind="支援"]{--ink:#a2c6dc}
.card[data-kind="剣技"]{--ink:#f2ad87}
.card.selected{border-color:#ffe1a6;box-shadow:inset 0 0 0 1px #ffe1a6,0 0 12px #e9bc7440}
.card strong{color:#fff3dc;font-size:14px;line-height:1.18;overflow-wrap:anywhere}
.card .desc{color:#dfd7cd;font-size:12px;line-height:1.35}
.card .cost{position:absolute;top:5px;left:5px;z-index:1;border:1px solid #997649;border-radius:50%;background:#1b171f;color:#ffdc9b;width:22px;height:22px;text-align:center;font-size:13px;line-height:20px;font-weight:800}
.card .symbol{display:grid;place-items:center;color:var(--ink,#f0cc94);font:26px/1 Georgia,serif;background:radial-gradient(ellipse,var(--ink,#b98d67) -160%,transparent 76%),repeating-conic-gradient(from 45deg, #b59a7e10 0deg 1deg, transparent 1deg 45deg);border-bottom:1px solid #75614c;text-shadow:0 0 12px currentColor}
.card .symbol span{transform:translateX(4px)}
.card .why{color:var(--rose);display:block;font-size:11px}
.target-tray{margin:7px 0;padding:7px;background:#2e2527;border:1px solid #a07b65;border-radius:7px}
.target-title{display:flex;align-items:center;justify-content:space-between;gap:5px}
.target-title b{font-size:14px}
.target-title .btn{padding-inline:7px}
.previews{margin-top:5px}
.previews.triple{grid-template-columns:repeat(3,minmax(0,1fr))}
.preview{padding:4px;text-align:left;border:1px solid #c18468;background:#3b2d32;border-radius:5px}
.preview b,.preview span{display:block;font-size:12px;line-height:1.35}
.preview span{color:#ffdec6}
.preview i{display:block;color:var(--blue);font-size:12px;font-style:normal}
.guide,.feedback{border-left:2px solid #ccac70;margin:6px 0;padding:4px 7px;background:#312a28;color:#ffe1ad;font-size:13px}
.feedback{border-color:#8face2;background:#223044;color:#e0eaff}
.feedback.linked{animation:flash .32s ease-out}
@keyframes flash{from{background:#735040}to{background:#223044}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.round-footer{margin-top:7px}
.round-footer .btn{flex:1}
.round-footer small{font-size:12px}
details{margin:10px 0;color:var(--muted)}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.utility{display:flex;justify-content:space-between;gap:6px;margin-top:7px}
.utility .btn{font-size:13px}
@media(max-width:350px){main{padding-inline:8px}h1{font-size:17px}.hero small{font-size:11px}.card strong{font-size:13px}.hero-title canvas{width:20px}.hero b{font-size:13px}}


.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));list-style:none;margin:8px 0 12px;padding:0;gap:5px}
.route li{padding:7px 3px;text-align:center;background:#202731;border:1px solid #5f5347;border-radius:5px;font-size:12px;color:var(--muted)}
.route li[aria-current=step]{border-color:#ecc58b;color:#ffe3b8;background:#423126}
.route li.done{color:#b7d4c0}
.home-scene{min-height:clamp(140px,25svh,220px)}
.launch{margin-top:8px}
.walkthrough{border:1px solid #8b6b49;border-left:3px solid #e6be82;background:#302820;border-radius:6px;margin:7px 0;padding:7px 8px;color:#ffe1b3;font-size:13px}
.walkthrough strong,.walkthrough span{display:block}
.walkthrough span{color:#e4d4c0}
.suggested{outline:2px solid #f4cb90;outline-offset:-3px}
.suggested-tag{font:700 11px/1.2 system-ui,sans-serif;color:#ffe0a9}
.round-footer small{flex:1}
.round-footer .btn{flex:none;white-space:nowrap}
.choice-option{width:100%;text-align:left;color:var(--cream);display:grid;gap:3px}
.choice-option[aria-pressed=true]{border-color:#f2c98b;background:#3e322b}
.next-step{padding:9px;border:1px solid #9d7952;background:#302822;border-radius:6px;margin:10px 0}
.forecast-rule{font-size:12px;color:#e7c998;line-height:1.35}
.enemy.charging{border-color:#c78564;background:linear-gradient(0deg,#2c2028ed,#24192170 72%,transparent)}
body[data-battle] main{background:#201b2d;overflow:hidden}
body[data-battle] header{min-height:42px;border-color:#544255}
body[data-battle] header h1{font:600 14px system-ui;color:#e2cdb7}
.battle-scene{height:clamp(252px,43svh,370px);position:relative;padding:0;overflow:hidden;isolation:isolate;border:1px solid #675165;border-radius:6px;background-color:#251e36;background-image:linear-gradient(0deg,#201b2d 0%,transparent 24%),url('./deck-water.webp?v=0.1.7');background-size:100% 100%;background-position:center;image-rendering:pixelated}
.battle-scene>canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.battle-scene .enemygrid{position:absolute;inset:auto 5px 5px;display:flex;justify-content:flex-end;align-items:flex-end}
.battle-scene .enemy{width:min(44%,165px);background:#1e172ad9;border:1px solid #6c546d;padding:4px 6px;gap:1px;z-index:1}
.battle-scene .enemy.targetable{border-color:#e4a67c;background:#352732}
.battle-scene .enemy.charging{border-color:#d28862}
.battle-scene .enemy .status:empty{display:none}
.battle-scene .enemy b{font-size:13px}
.battle-scene .enemy small,.battle-scene .enemy .intent{font-size:12px}
.battle-scene .enemy[aria-disabled=true]{cursor:default}
.hero .energy-pips{display:inline-flex;gap:3px;margin-right:3px;align-items:center}
.hero .energy-pips i{height:7px;width:7px;background:#e2b473;display:inline-block;clip-path:polygon(22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%,0 22%)}
.hero .energy-pips i.spent{background:#625164}
.hero{background:#262235;border-color:#625065}
.hero.sel{border-color:#eac082;box-shadow:none}
.hero.is-target{outline:1px dashed #e5a086;outline-offset:-3px}
.card{grid-template-rows:43px auto;justify-items:center;min-height:77px;background:#312a40;box-shadow:none;border-color:#736076}
.card[data-kind="防御"],.card[data-kind="回復"],.card[data-kind="支援"]{background:#263448}
.card[data-kind="剣技"]{background:#3c2b37}
.card .card-glyph{width:34px;height:34px;image-rendering:pixelated;align-self:center}
.card .art-row{display:flex;align-items:center;gap:5px;color:var(--ink,#f4dcad);align-self:center}
.card .art-row b{font-size:16px}
.card .why{grid-column:1/-1}
.card .cost{background:#201b2d;border-color:#646176;border-radius:3px}
.card.suggested{outline-color:#efc082}
.card.selected{border-color:#ffe2a5;box-shadow:inset 0 0 0 1px #ffe2a5}
.target-title{flex-wrap:wrap}
.target-title small{width:100%;color:#f0d8c4}
.walkthrough{margin:6px 0 0;background:#312435}
.clip-announcement{position:absolute;top:10px;right:7px;font:700 13px/1.15 system-ui;color:#ffe7ba;background:#291c22dd;border:1px solid #ef9e69;padding:6px 8px;border-radius:4px;z-index:1;pointer-events:none}
body[data-battle] details{margin-block:3px}
@media(max-width:350px){.card .cost{width:18px;height:18px;line-height:16px}.card .art-row{gap:3px}.card .card-glyph{width:28px;height:28px}}
.battle-scene[data-stage="1"]{background-image:linear-gradient(0deg,#201b2d 0%,#1a354a35 65%,#253d5b65),url('./deck-water.webp?v=0.1.7')}
.battle-scene[data-stage="3"]{background-image:linear-gradient(0deg,#201b2d 0%,#44182935 65%,#28182b69),url('./deck-water.webp?v=0.1.7')}
body[data-battle] main{background:#1b1927}
body[data-battle] header{min-height:34px}
.encounter{padding:5px 0 6px}
.battle-scene{height:clamp(245px,43svh,365px);border:0;box-shadow:0 0 0 1px #776274;background-image:linear-gradient(0deg,#1b1927,transparent 28%),url('./deck-water.webp?v=0.1.7')}
.battle-scene[data-stage="1"]{background-image:linear-gradient(0deg,#1b1927,transparent 30%),url('./deck-road.webp?v=0.1.7')}
.battle-scene[data-stage="3"]{background-image:linear-gradient(0deg,#1b1927,transparent 30%),url('./deck-altar.webp?v=0.1.7')}
.unit-tap{position:absolute;top:49%;height:25%;width:clamp(44px,15%,76px);z-index:1;transform:translateX(-50%);background:transparent;border:1px solid transparent;border-radius:5px;padding:0;touch-action:manipulation}
.unit-tap.foe{width:clamp(48px,19%,96px)}
.unit-tap[aria-disabled="true"]{cursor:default}
.unit-tap.targetable{background:#f2c76512;border-color:#e5bd7e;border-style:dashed}
.unit-tap.targetable::after{content:"";position:absolute;left:50%;top:-10px;width:7px;height:7px;background:#f6ca84;transform:translateX(-50%) rotate(45deg)}
.unit-tap.targetable:focus-visible{outline-offset:2px}
.unit-hp{position:absolute;left:4px;right:4px;bottom:-7px;height:6px;background:#261c2d;border:1px solid #dcae918f;border-radius:2px;overflow:hidden;pointer-events:none}
.unit-hp i{position:absolute;top:0;bottom:0;left:0;background:#e78979}
.unit-hp .hp-shadow{background:#f4d2a2}
.unit-tap.ally .unit-hp i{background:#a7c19b}
.unit-tap .delta{display:block;position:absolute;bottom:100%;left:50%;transform:translate(-50%,-3px);padding:3px 5px;color:#fff0cc;background:#2d2233;border:1px solid #96705e;font:700 13px/1.12 system-ui;border-radius:3px;white-space:nowrap}
.delta.good{color:#baede4;border-color:#7babac}
.foe-forecast{position:absolute;z-index:2;top:7px;right:5px;left:5px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;pointer-events:none}
.foe-forecast>div{padding:5px 6px;background:#191a29d9;border:1px solid #7c5d68;border-radius:5px;justify-self:end;min-width:0;max-width:100%}
.foe-forecast b,.foe-forecast span{display:block;font-size:12px;overflow-wrap:anywhere}
.foe-forecast span{color:#ffc790;font-weight:700}
.foe-forecast .charge{border-color:#eea359}
.foe-forecast .charge span{color:#ffb87d}
.foe-forecast small{font:600 11px system-ui;color:#f0ccb3;display:block}
.scene-caption{position:absolute;left:7px;right:7px;bottom:7px;display:flex;gap:6px;justify-content:center;align-items:center;z-index:2;pointer-events:none;color:#ffe0ac}
.scene-caption b{background:#261e31ed;border:1px solid #a27a60;border-radius:4px;padding:4px 7px;font-size:12px;text-align:center}
.scene-caption .danger{color:#ffc08b}
.scene-caption .pulse{color:#bfe6d2}
.party-row{margin:7px 0 3px}
.hero{padding:3px 5px}
.hero .hero-title{height:25px}
.hero .hero-title canvas{width:19px;height:26px}
.hero .energy{font-size:12px}
.hand-head{margin:3px 0;min-height:21px}
.hand-head small{font-size:12px}
.card .cost{width:19px;height:19px;line-height:17px}
.card .art-row b{font-size:15px}
.card .desc{display:none}
.target-tray.in-scene{padding:5px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px;background:#292233;border-color:#725972}
.target-tray.in-scene button{height:44px}
.target-tray.in-scene small{font-size:12px}
.target-tray.in-scene .plan{grid-column:1/-1;min-width:0;}
.target-tray.in-scene .plan summary{min-height:44px;margin:0}
.scene-response{margin:5px 0;padding:3px 6px;border-left:2px solid #947054;color:#ead4c3;font-size:12px}

:root{--gold:#e1c18d;--cream:#f6ecd6;--line:#574a42;--muted:#c1b9ad}
body,main,body[data-battle] main{background:#171c20}
main{padding-inline:12px}header,body[data-battle] header{border-bottom:1px solid #8a7457;background:#1d2426}
header h1,body[data-battle] header h1,h2,h3,.card strong,.btn.full,.round-footer button{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.04em}
header h1{font-size:18px}header small{color:#c6b397}
.panel,.slot,.btn,.choice,.hud>div,.route li,.walkthrough,.battle-scene,.foe-forecast>div,.hero,.card,.hp,.nav button,.target-tray,details,.scene-caption b,.next-step{border-radius:0}
.panel,.choice,.slot,.hud>div,.btn.alt,.deckmini span,.hero{background:#222a2c;border-color:#564e42}
.panel{padding:12px;box-shadow:inset 0 2px #373a35}
.home-scene,.guild-banner,.reward-land{background-image:var(--scene);image-rendering:pixelated;background-size:100% 100%;position:relative}
.home-scene{height:clamp(195px,32svh,300px);min-height:0;padding:14px;box-shadow:inset 0 -46px 24px -10px #111923}
.home-scene h2,.guild-banner h2{color:#ffe8b7;text-shadow:2px 2px #151920;font-size:27px;margin:0}
.home-scene p{margin:1px 0}.guild-banner,.reward-land{height:98px;background-size:cover;background-position:center 60%;display:flex;align-items:flex-end;padding:8px 12px}.guild-banner h2{font-size:21px}
.route{gap:2px}.route li{border:0;border-bottom:2px solid #6c6154;background:#293031}.route li[aria-current=step]{background:#433b2f;border-color:#e4be7f}
.nav{background:#171d20;border-color:#70624f;gap:0}.nav .btn{border:0;border-top:2px solid transparent;background:transparent;color:#bcbdb2}.nav .active{border-color:#e8bc78;color:#ffe3b5;background:#33332c}
.btn:not(.alt,.hero,.slot),.round-footer button{background:#dec18d;color:#231f20;border-color:#f1d49c}
.encounter{border-bottom:2px solid #b49165}.battle-scene{height:clamp(218px,36svh,330px)}
.foe-forecast>div{background:#182128ed;border-color:#82735f;border-left:3px solid #e4a476}
.walkthrough{border:0;border-left:3px solid #b69464;background:#272c2c;padding:4px 7px}.walkthrough span{display:none}
.hero.sel,.slot.sel{border-color:#dfba84;background:#38392e;box-shadow:inset 0 -3px #dcba82}
.hand{gap:6px}.hand-head{padding:4px 0}.card,.card[data-kind]{border:1px solid #ba986c;background:#ded0ac;color:#242027;box-shadow:inset 0 0 0 2px #574b43;grid-template-rows:46px auto auto;gap:2px;padding:4px 4px 6px;align-content:start}
.card .art-row{background-size:100% 100%;image-rendering:pixelated;height:46px;width:100%;justify-content:center;border-bottom:2px solid #71604d;position:relative}
.card .art-row b{position:absolute;right:1px;bottom:1px;color:#fff1c3;background:#20242a;padding:0 3px}
.card .cost{left:5px;top:5px;z-index:1;background:#292c31;color:#ffe4ae;border:1px solid #a48b69}
.card strong{font-size:14px;color:#292626}.card-school{font-size:10px;color:#564837;line-height:1.1}
.card.selected{outline:2px solid #ffe291;outline-offset:1px;background:#f6e2ad}
.person{border-bottom:1px solid #514c42}.person canvas,.slot canvas{image-rendering:pixelated;background:#303734;border-bottom:2px solid #a58b63}
.choice-option{border-left:4px solid #987e65;padding:10px}.choice-option[aria-pressed=true]{background:#373b34;border-color:#dbba84}
.btn.hero,.btn.slot,.nav .btn.active{color:#f7e8ce}.btn.hero .hp i{background:#92b99e}
.unit-tap canvas[data-person]{display:none}
.unit-tap .field-name,.unit-tap .field-energy{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff1cc;text-shadow:1px 1px 1px #080e13,-1px -1px 1px #080e13}
.field-name{bottom:calc(100% + 1px);font:700 12px/1.2 system-ui}
.field-energy{top:calc(100% + 7px);height:10px;display:flex;align-items:center}
.field-energy .energy-pips{display:flex;gap:2px}.field-energy i{background:#ffe4a0;width:5px;height:5px;display:block}.field-energy i.spent{background:#434d51}
.unit-tap .delta{bottom:auto;top:10%;z-index:2}.scene-caption{bottom:1px}
.battle-scene{height:clamp(255px,43svh,380px)}
.card-table{padding:9px 10px 13px;margin:3px -4px 0;background:repeating-linear-gradient(0deg,#302925 0 2px,#322b27 3px 6px,#352d28 7px 9px);border-block:2px solid #604d3b}
.hand-head h3{color:#ffdeb0}.hand{display:flex;justify-content:center;flex-wrap:wrap;gap:0;padding:9px 0 5px}
.hand .card{width:clamp(76px,25%,112px);min-height:102px;position:relative;box-shadow:2px 3px #171514;transform-origin:50% 92%;margin-inline:-1px;transition:transform .13s}
.hand .card:first-child:not(:only-child){transform:rotate(-5deg) translateY(3px)}
.hand .card:last-child:not(:only-child){transform:rotate(5deg) translateY(3px)}
.hand .card.selected{transform:translateY(-7px);z-index:1}.card-table .hand-head{border-bottom:1px solid #74604a}
body[data-battle] .round-footer{border-bottom:1px solid #5d5346;padding-block:4px}

</style></head><body><main><header><h1>アルヴェイン 運命の手札</h1><small id="edition">試作 0.1.7</small></header><div id="notice" class="notice" role="status"></div><div id="view"></div></main><nav class="nav" id="nav" aria-label="王国メニュー"></nav><script src="./pixel-engine.js"></script><script src="./deck-core.js?v=0.1.7"></script><script>
'use strict';
const E=AlveinDeck,P=window.AlveinPixelEngine,$=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
const practice=query.get('practice')==='1';
const mode=!practice&&query.get('energy')==='shared'?'shared':'personal';
const K=practice?'alvein-deck-destiny-practice-v1':mode==='shared'?'alvein-deck-destiny-shared-v1':'alvein-deck-destiny-v1';
let s,raw=null,storage=true,notice='',tab='home',slot=0,active=0,card=-1,detail=null,learn=null,confirm='',pending=null,learnedHere=null;
try{
  raw=localStorage.getItem(K);
  if(raw!==null){
    s=JSON.parse(raw);
    if(!E.valid(s)){s=null;storage=false;notice='セーブを読み取れなかったため、一時プレイ中です。元のデータは保持されています。'}
  }
}catch{
  storage=false;notice='保存を読み込めないため、一時プレイ中です。';
}
if(!s)s=E.init();
if(s.run)tab='battle';
if(mode==='shared')$('edition').textContent='共有行動力・比較版';
if(practice)$('edition').textContent='練習遠征 0.1.7';
function save(){
  if(!storage)return;
  try{
    if(localStorage.getItem(K)!==raw){
      storage=false;
      notice='別の画面で保存が更新されました。最新の進行はページを再読み込みすると表示されます。';
      return;
    }
    const next=JSON.stringify(s);
    localStorage.setItem(K,next);raw=next;
  }catch{storage=false;notice='保存に失敗したため、一時プレイ中です。'}
}
addEventListener('storage',ev=>{
  if(storage&&ev.key===K&&ev.newValue!==raw){
    storage=false;notice='別の画面で保存が更新されました。最新の進行はページを再読み込みすると表示されます。';
    $('notice').textContent=notice;
  }
});
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(t,a,d=false,c='')=>'<button class="btn '+c+'" data-a="'+a+'" '+(d?'disabled':'')+'>'+t+'</button>',hud=a=>'<div class="hud">'+a.map(([k,v])=>'<div><small>'+k+'</small><b>'+v+'</b></div>').join('')+'</div>',bar=(h,m)=>'<div class="hp"><i style="width:'+Math.max(0,Math.min(100,h/m*100))+'%"></i></div>',portrait=p=>'<canvas data-person="'+p.id+'" aria-label="'+esc(p.name)+'"></canvas>',by=id=>s.roster.find(p=>p.id===id);
function person(p,offer){let r=E.roles[p.role],t=E.talents[p.talent];return '<article class="person">'+portrait(p)+'<div><b>'+esc(p.name)+'</b> <small>'+r.name+'</small><p class="tag">'+t.name+' · '+t.desc+'</p><p class="stat">HP '+p.hp+' · 潜在 '+'◆'.repeat(p.potential)+' · '+esc(p.origin)+'</p><p class="stat">固有：'+E.cards[p.signature][0]+'</p></div><div>'+b(offer?'採用1':'配置',offer?'recruit:'+p.id:'assign:'+p.id,!!s.run||(offer?s.coins<1||s.roster.length>=40:s.party[slot]===p.id),'alt')+(!offer?b('デッキ','detail:'+p.id,false,'alt'):'')+'</div></article>'}
function roster(){let h='<div class="guild-banner"><h2>遠征隊の編成</h2></div>'+hud([['募集令',s.coins],['所属',s.roster.length],['帰還',s.runs]])+'<div class="panel"><h3>遠征編成</h3><p class="muted">枠を選び、所属人物の「配置」を押す。</p><div class="three">'+s.party.map((id,i)=>{let p=by(id);return b(portrait(p)+esc(p.name)+'<br><small>'+E.roles[p.role].name+'</small>','slot:'+i,false,'slot '+(i===slot?'sel':'alt'))}).join('')+'</div></div>';
if(detail!==null){let p=by(detail);if(p){h+='<div class="panel"><div class="row"><h3>'+esc(p.name)+' の独立デッキ</h3>'+b('閉じる','close',false,'alt')+'</div><p class="tag">'+E.talents[p.talent].desc+'</p><div class="deckmini">'+p.deck.map((c,i)=>learn?b(E.cards[c][0],'replace:'+i,!!s.run||i===p.deck.length-1,'alt'):'<span>'+E.cards[c][0]+(i===p.deck.length-1?' ★':'')+'</span>').join('')+'</div><h3>永続習得カード</h3><p class="stat">習得カードを選び、上の入れ替えるカードをタップ。固有カードは固定。</p><div class="deckmini">'+(p.learned.length?p.learned.map(c=>b(E.cards[c][0],'learn:'+c,!!s.run,learn===c?'sel':'alt')).join(''):'<small>まだ習得していない</small>')+'</div></div>'}}
return h+'<div class="panel"><h3>所属人物</h3>'+s.roster.map(p=>person(p,false)).join('')+'</div><div class="panel"><div class="row"><h3>志願者</h3>'+b('探索1','scout',!!s.run||s.coins<1,'alt')+'</div><p class="muted">重複しない生成人物。才能と固有カードを比較しよう。</p>'+s.offers.map(p=>person(p,true)).join('')+'</div>'}
function route(active,cleared=0){
  return '<ol class="route" aria-label="遠征の道順">'+names.map((name,i)=>{
    const stage=i+1;
    return '<li '+(stage===active?'aria-current="step"':'')+' class="'+(stage<=cleared?'done':'')+'">'+(stage<=cleared?'✓ ':stage+' · ')+name+'</li>';
  }).join('')+'</ol>';
}
function outcome(r){
  const reward=r.phase==='reward', last=r.stage===3, options=reward?r.rewards:r.permanent;
  const next=reward?(last?'持ち帰る札の選択へ':names[r.stage]+'へ進む'):'王国へ帰る';
  const heading=reward?'戦闘勝利 · 戦利品':r.phase==='return'?'遠征制覇！':'遠征から撤退';
  const description=reward
    ?(last?'最後の戦利品です。ここで取った札も、帰還時に持ち帰る候補にできます。':'選んだ札は、次の戦いから持ち主のデッキに加わります。')
    :(options.length?'持ち帰る札を1枚選びます。帰還後、「人物・デッキ」で習得した札を装備できます。':'この遠征で持ち帰れる札はありません。王国から再出撃できます。');
  const picks=options.map((q,i)=>{
    const c=E.cards[q.card],person=r.heroes.find(p=>p.id===q.id);
    return '<button class="choice choice-option" data-a="pick:'+i+'" aria-pressed="'+(pending===i)+'"><span class="link"><strong>'+c[1]+' '+c[0]+'</strong></span><small>'+esc(person.name)+'の札 · 行動力 '+c[2]+'</small><span>'+c[4]+'</span></button>';
  }).join('');
  const action=reward?'reward:':'return:';
  const chosen=options[pending];
  return '<section class="panel spoils"><div class="reward-land" data-stage="'+r.stage+'"></div><h2>'+heading+'</h2>'+route(r.stage,reward?r.stage:r.phase==='return'?3:r.stage-1)+
    '<p>'+description+'</p>'+picks+
    (chosen?b(next,action+pending,false,'full'):options.length?'<p class="next-step">札を選ぶと「'+next+'」に進めます。</p>':'')+
    b(options.length?'札を選ばず進む':next,action+'-1',false,options.length?'alt full':'full')+
    '</section><details><summary>遠征記録</summary><div class="log">'+r.log.map(esc).join('\n')+'</div></details>';
}
function home(){

    for(let i=0;i<6;i++){
      const x=(i*37+8)%190,y=49+(i*13)%79;
      const light=moving&&Math.floor(t*4+i)%3===0?'#eeaa6740':'#ffaf657c';
      px(x,y,1,1,light);
    }
    r.heroes.forEach((hero,i)=>{
      const impact=incoming?.find?.(a=>a.target===hero.id&&a.kind==='attack');
      if(!hero.hp&&!impact)return;
      const acting=moving&&stageFx.actor===hero.id;
      const x=heroX[i]+(acting?Math.round(Math.sin(t*Math.PI)*8):0);
      if(i===active){
        px(x-14,ground-1,28,1,'#edab65');
        for(let pip=0;pip<(r.mode==='shared'?0:hero.energy);pip++)px(x-4+pip*4,ground+3,2,2,'#ecc176');
      }
      c.save();
      c.translate(0,ground+9+ground*.42);
      c.scale(1,-.42);c.globalAlpha=.17;
      drawActor(hero,x,ground);
      c.restore();
      drawActor(hero,x,ground);
      if(hero.block||impact?.blocked)px(x-7,ground-30,14,1,'#81b9d6');
      if(impact){
        const source=foePosition(r,r.enemies.findIndex(e=>e.id===impact.actor));
        const p=Math.min(1,t*1.7);
        px(source+(x-source)*p,ground-14,4,2,'#f5a17c');
        if(t>.35){
          c.fillStyle=impact.blocked?'#a2daea':'#ffc1a3'; c.font='bold 8px monospace';c.textAlign='center';
          c.fillText(impact.amount?'-'+impact.amount:'防御',x,ground-31-t*8);
        }
      }
    });
    r.enemies.forEach((foe,i)=>{
      const effect=moving&&stageFx.hits.find(hit=>hit.id===foe.id);
      const burn=incoming?.find?.(a=>a.target===foe.id&&a.kind==='burn');
      const guard=incoming?.find?.(a=>a.target===foe.id&&a.kind==='guard');
      if(!foe.hp&&!effect&&!burn)return;
      const x=foePosition(r,i);
      const dragon=foe.art==='dragon', w=dragon?61:36, h=dragon?35:25;
      const knock=effect?Math.round(Math.sin(t*Math.PI)*5):0;
      const texture=foeTexture(foe.art);
      c.globalAlpha=foe.hp?1:Math.max(0,1-t);
      c.save();
      c.translate(x+Math.round(w/2)+knock,0);
      c.scale(-1,1);
      c.drawImage(texture,0,ground-h,w,h);
      c.restore();
      c.globalAlpha=1;
      if(foe.hp){
        if(foe.burn)px(x+12,ground-h+4,2,4,'#ffba73');
        if(foe.mark)px(x-3,ground-h-5,6,2,'#d0e49a');
      }
      if(burn){
        for(let k=0;k<4;k++)px(x-6+k*4,ground-h/2-((t*20+k*3)%17),2,3,'#ff995e');
        c.font='bold 8px monospace';c.fillStyle='#ffb575';c.textAlign='center';
        c.fillText('-'+burn.amount,x,ground-h-3-t*8);
      }
      if(guard){
        px(x-9,ground-h-3,18,1,'#89bfdd');px(x-10,ground-h-2,1,13,'#89bfdd');px(x+9,ground-h-2,1,13,'#89bfdd');
      }
      if(effect){
        const glyph=glyphByCard[stageFx.card][0];
        const tone=glyph==='flame'?'#ff9758':glyph==='crack'?'#d9a6f1':glyph==='mark'?'#ccdf86':'#fff0c2';
        const spread=stageFx.card==='blast'?27:13;
        const impact=stageFx.card==='blast'?.22:0;
        if(stageFx.card==='blast'&&t>.22&&t<.45){
          const radius=Math.round((t-.15)*66);
          px(x-radius,ground-h/2-radius,2*radius,2,'#ffe4a3');
          px(x-radius,ground-h/2+radius,2*radius,2,'#ef974f');
          px(x-radius,ground-h/2-radius,2,2*radius,'#ffba70');
          px(x+radius,ground-h/2-radius,2,2*radius,'#ffba70');
        }else if(glyph==='crack'&&t<.55){
          c.strokeStyle='#eff0ff';c.lineWidth=2;c.beginPath();
          c.moveTo(x-11,ground-h-3);c.lineTo(x+1,ground-h/2);c.lineTo(x-3,ground-h/2);c.lineTo(x+11,ground+1);c.stroke();
        }else if(stageFx.card==='flame'){
          for(let j=0;j<5;j++)px(x-8+j*4,ground-5-((t*22+j*4)%21),3,4,j%2?'#eb7053':'#ffb467');
        }
        for(let j=0;j<9;j++){
          const angle=j*2.399;
          const offset=Math.max(0,t-impact)*spread+2;
          px(x+Math.cos(angle)*offset,ground-h/2+Math.sin(angle)*offset,j%3===0?3:1,j%3===0?2:1,tone);
        }
        if(effect.hp<0){
          c.fillStyle='#fff2ca';c.font='bold 9px monospace';c.textAlign='center';
          c.fillText(String(effect.hp),x,ground-h-8-t*7);
        }
      }
    });
    if(moving&&stageFx.actor&&stageFx.hits.length&&['flame','blast','arrow','spark','storm'].includes(stageFx.card)){
      const i=r.heroes.findIndex(h=>h.id===stageFx.actor);
      const j=r.enemies.findIndex(e=>e.id===stageFx.hits[0].id);
      const p=Math.min(1,t*2.9);
      const destination=foePosition(r,j);
      const tone=stageFx.card==='arrow'?'#ffe9a9':'#ffa264';
      const x=heroX[i]+(destination-heroX[i])*p;
      px(x-5,ground-17,5,1,tone);px(x,ground-18,3,3,tone);
    }
    if(moving){
      for(const ward of stageFx.wards.filter(w=>w.block>0||w.hp>0)){
        const x=heroX[r.heroes.findIndex(h=>h.id===ward.id)];
        const tone=ward.block>0?'#9bd5ed':'#b6e6ae';
        px(x-10,ground-26,20,1,tone);px(x-11,ground-25,1,15,tone);px(x+10,ground-25,1,15,tone);
      }
      animationFrame=requestAnimationFrame(renderFrame);
    }
  };
  renderFrame(performance.now());
}
function drawArt(){
  document.querySelectorAll('canvas[data-person]').forEach(c=>{
    const p=[...s.roster,...s.offers].find(p=>p.id===+c.dataset.person);
    if(!p||!P)return;
    const r=E.roles[p.role];
    P.draw(c,P.make('destiny:'+p.id+':'+p.name,{species:'human',job:r.job,armor:r.armor,weapon:r.weapon}),2);
  });
  document.querySelectorAll('canvas[data-glyph]').forEach(drawGlyph);
  drawBattlefield();
}
function render(){
  $('notice').textContent=notice;
  document.body.dataset.tab=tab;
  document.body.toggleAttribute('data-battle',tab==='battle'&&(s.run?.phase==='battle'||winTimer));
  $('nav').innerHTML=[['home','王国'],['roster','人物・デッキ'],['battle','遠征']].map(([k,v])=>b(v,'tab:'+k,false,k===tab?'active':'alt')).join('');
  $('view').innerHTML=({home,roster,battle}[tab])();
  drawArt();
}
let lastAdvance=0;
document.addEventListener('click',ev=>{
  const z=ev.target.closest('button[data-a]');
  if(winTimer||!z||z.disabled||z.getAttribute('aria-disabled')==='true')return;
  const [a,i]=z.dataset.a.split(':'),n=Number(i),r=s.run;
  const advancing=['start','reward','return','end','end-now','withdraw-now'].includes(a);
  if(advancing&&performance.now()-lastAdvance<240&&lastAdvance)return;
  let changed=false;
  const priorConfirm=confirm;
  confirm='';
  const use=target=>{
    if(r?.phase!=='battle')return;
    const actor=r.heroes[active], effect=battleEffects(r,actor,card,target);
    if(effect&&E.play(s,actor.id,card,target)){
      sceneAction=effect;
      if(r.phase==='reward'&&!reducedMotion.matches){
        winTimer=setTimeout(()=>{winTimer=0;render();window.scrollTo(0,0)},440);
      }
      card=-1;changed=true;
    }
  };
  if(a==='tab'){tab=i;card=-1;pending=null}
  else if(a==='start'){if(!s.run)changed=E.start(s,mode);tab='battle';active=0;card=-1}
  else if(a==='pick')pending=pending===n?null:n;
  else if(a==='learned-deck'&&learnedHere){tab='roster';detail=learnedHere.id;learn=learnedHere.card}
  else if(a==='slot')slot=n;
  else if(a==='recruit')changed=E.recruit(s,n);
  else if(a==='scout')changed=E.scout(s);
  else if(a==='assign')changed=E.assign(s,slot,n);
  else if(a==='detail'){detail=n;learn=null}
  else if(a==='close'){detail=null;learn=null}
  else if(a==='learn')learn=i;
  else if(a==='replace'){changed=E.equip(s,detail,learn,n);if(changed){if(learnedHere?.id===detail&&learnedHere.card===learn)learnedHere=null;learn=null;notice='デッキの札を入れ替えました。'}}
  else if((a==='hero'||a==='party')&&r?.phase==='battle'){active=n;card=-1}
  else if(a==='enemy')use(i);
  else if(a==='use')use(i.startsWith('e')?i:n);
  else if(a==='card'&&r?.phase==='battle')card=card===n?-1:n;
  else if(a==='cancel')card=-1;
  else if(a==='withdraw')confirm='withdraw';
  else if(a==='withdraw-now'&&priorConfirm==='withdraw'){changed=E.withdraw(s);card=-1}
  else if(a==='end'||a==='end-now'){
    if(a==='end'&&r?.heroes.some(p=>p.hp&&p.hand.some(c=>E.affordable(p,c,r))))confirm='end';
    else if(a==='end'||priorConfirm==='end'){
      const incoming=[];
      changed=E.end(s,incoming);card=-1;
      if(changed){
        sceneAction={run:r,hits:[],wards:[],incoming,at:performance.now()};
        if(r.phase==='reward'&&incoming.length&&!reducedMotion.matches){
          winTimer=setTimeout(()=>{winTimer=0;render();window.scrollTo(0,0)},440);
        }
      }
    }
  }else if(a==='reward'){changed=E.reward(s,n);active=0;card=-1;pending=null}
  else if(a==='return'){
    const selected=r?.permanent[n];
    changed=E.returnHome(s,n);
    if(changed){pending=null;learnedHere=selected||null}
    if(changed){tab='home';detail=null;learn=null;notice='王国に帰還しました。'}
  }
  if(advancing&&changed)lastAdvance=performance.now();
  if(changed)save();
  render();
  const focus=[...$('view').querySelectorAll('button[data-a]')].find(btn=>btn.dataset.a===z.dataset.a&&!btn.disabled);
  focus?.focus({preventScroll:true});
  if(a==='pick'&&pending!==null)$('view').querySelector('[data-a="'+(s.run.phase==='reward'?'reward':'return')+':'+pending+'"]')?.scrollIntoView({block:'nearest'});
  if(a==='card'&&card>=0&&E.targetType(r?.heroes[active]?.hand[card])==='self')$('view').querySelector('.target-tray')?.scrollIntoView({block:'nearest'});
  if((changed&&['start','reward','return','withdraw-now','end','end-now'].includes(a))||a==='learned-deck')window.scrollTo(0,0);
});
render();
</script></body></html>
