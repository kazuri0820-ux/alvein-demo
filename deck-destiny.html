<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>アルヴェイン｜運命の手札</title><style>
:root{color-scheme:dark;--gold:#dfbf7c;--text:#efe4d1;--muted:#b5b2a7;--edge:#776445;--bg:#151c1b;--card:#2b3530}*{box-sizing:border-box}body{margin:0;background:#101615;color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:560px;margin:auto;min-height:100dvh;padding:12px 12px calc(82px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0,#3d4033,#202a25 45%,#141b19)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #9b8454;padding:8px 0 12px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,"Yu Mincho",serif;color:#f0d299}h1{font-size:23px}h2{font-size:23px}h3{font-size:16px}p{margin:5px 0}small,.muted{color:var(--muted)}small{font-size:11px}.kicker{color:#c7ac75;font-size:10px;letter-spacing:.13em}.panel{margin:10px 0;padding:12px;border:1px solid var(--edge);border-radius:8px;background:linear-gradient(130deg,#333c30,#222d27);box-shadow:0 4px 12px #0003}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.hud,.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.hud div{background:#202a24;border:1px solid #746346;border-radius:5px;padding:8px}.hud b{font-size:22px;color:var(--gold);display:block}.hud small{display:block}.btn{font:inherit;touch-action:manipulation;cursor:pointer;min-height:44px;color:var(--text);font-weight:700;font-size:12px;padding:8px 10px;border:1px solid #b49659;background:linear-gradient(#80643b,#4e3d23);border-radius:5px}.btn.alt{background:#29382f;border-color:#6d775d}.btn.sel{background:#655033;border-color:#eed190}.btn:disabled{opacity:.4;cursor:default}.full{width:100%;margin-top:8px}.slot{min-width:0;text-align:center}.slot canvas{width:42px;height:56px;image-rendering:pixelated;display:block;margin:auto}.person{display:grid;grid-template-columns:47px minmax(0,1fr) auto;align-items:center;gap:8px;border:1px solid #6e634a;border-radius:5px;background:#26332b;padding:7px;margin:7px 0}.person canvas{width:47px;height:63px;image-rendering:pixelated;border:1px solid #8c7852;background:radial-gradient(#67614a,#212b25)}.person b{color:#ebd09a}.tag{font-size:11px;color:#c7d6a9}.stat{font-size:11px;color:#c4bda7}.art{width:100%;display:block;image-rendering:pixelated;border-radius:4px}.enemygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.enemy{padding:6px;border:1px solid #89604e;background:linear-gradient(#40332d,#272725);border-radius:5px;text-align:center;min-width:0}.enemy.selected{border:2px solid #e8af7b;padding:5px}.enemy .monster{font-size:27px;line-height:1.4;color:#e2a78c}.enemy b{font-size:13px}.hp{height:6px;background:#152018;overflow:hidden;border-radius:3px;margin:5px 0}.hp i{display:block;height:100%;background:#91b67c}.enemy .hp i{background:#c16e59}.intent{color:#edab86;font-size:10px;min-height:17px}.status{color:#e2c581;font-size:10px;min-height:14px}.battlehead{padding:8px;overflow:hidden}.hero{display:block;text-align:center;min-width:0;padding:5px;min-height:95px}.hero canvas{width:34px;height:46px;image-rendering:pixelated;display:block;margin:auto}.hero b{font-size:11px;display:block}.hero small{display:block;font-size:10px}.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-width:0;min-height:137px;text-align:center;border:1px solid #b29b62;border-radius:7px;padding:6px;background:radial-gradient(ellipse at top,#575a42,#313b32 60%,#242d26);color:#f1dfb9;box-shadow:inset 0 0 0 2px #191e1b;font:inherit;touch-action:manipulation;cursor:pointer}.card.selected{outline:2px solid #f3d28a;transform:translateY(-2px)}.card:disabled{opacity:.38}.card b{font-size:12px;line-height:1.3}.card .symbol{font-size:32px;line-height:1.15;color:#e8c986}.card .cost{position:absolute;left:5px;top:5px;background:#24394a;border:1px solid #a4c0ca;border-radius:50%;width:20px;height:20px;font-weight:700;font-size:12px;line-height:18px}.card .desc{font-size:10px;line-height:1.3;color:#dedac9}.card[data-kind="魔法"]{background:radial-gradient(ellipse at top,#584964,#333443 60%,#252937)}.card[data-kind="回復"]{background:radial-gradient(ellipse at top,#4e6845,#354433 60%,#263329)}.card[data-kind="射撃"]{background:radial-gradient(ellipse at top,#6a5941,#443b31 60%,#2f2924)}.card[data-kind="連携"]{background:radial-gradient(ellipse at top,#78613b,#493f2e 60%,#2e2d24);border-color:#e1bb68}.card[data-kind="防御"]{background:radial-gradient(ellipse at top,#495968,#34424c 60%,#28363a)}.card .kind{font-size:9px;color:#b8b8a7}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#19231e;border-top:1px solid #90764a;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{min-height:46px}.nav button.active{background:#5b4c31}.log{font-size:11px;white-space:pre-line;color:#c5c8b7;min-height:40px}.choice{padding:10px;background:#26342b;border:1px solid #7e7050;border-radius:5px;margin:7px 0}.notice{color:#f4ca79;font-size:12px;padding-top:5px}.link{color:#e3c17a}.screen-title{margin:10px 0}.sep{height:1px;background:#746348;margin:8px 0}.enemy button{width:100%;background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;padding:0;min-height:66px}.deckmini{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.deckmini span,.deckmini button{border:1px solid #79694d;padding:5px 7px;border-radius:4px;background:#26352c;font-size:11px;color:#e4cfa4}.deckmini button{min-height:40px;cursor:pointer}.targethint{font-size:11px;color:#f5d08e;background:#4b402a;padding:6px;border:1px solid #a78a56;border-radius:4px;margin-top:6px}a{color:#cdb580}.bottom{text-align:center;margin-top:14px;font-size:10px}
</style></head><body><main><header><div><div class="kicker">ALVEIN · DECKS OF DESTINY</div><h1>アルヴェイン 運命の手札</h1></div><small>試作 0.1</small></header><div id="notice" class="notice"></div><div id="view"></div><div class="bottom"><a href="./fusion-lab.html">旧企画へ</a> · 新版専用セーブ</div></main><nav class="nav" id="nav"></nav><script src="./pixel-engine.js"></script><script src="./deck-core.js"></script><script>
'use strict';const E=AlveinDeck,P=window.AlveinPixelEngine,$=id=>document.getElementById(id),K='alvein-deck-destiny-v1';let s,storage=true,notice='',tab='home',slot=0,active=0,card=-1,detail=null,learn=null;
try{let raw=localStorage.getItem(K);if(raw){s=JSON.parse(raw);if(!E.valid(s)){storage=false;s=null;notice='セーブ異常のため一時プレイ（上書きしません）'}}}catch(e){storage=false;notice='保存にアクセスできないため一時プレイ'}if(!s)s=E.init();if(s.run)tab='battle';
const save=()=>{if(storage)try{localStorage.setItem(K,JSON.stringify(s))}catch(e){storage=false;notice='保存失敗：一時プレイ'}};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(t,a,d=false,c='')=>'<button class="btn '+c+'" data-a="'+a+'" '+(d?'disabled':'')+'>'+t+'</button>',hud=a=>'<div class="hud">'+a.map(([k,v])=>'<div><small>'+k+'</small><b>'+v+'</b></div>').join('')+'</div>',bar=(h,m)=>'<div class="hp"><i style="width:'+Math.max(0,Math.min(100,h/m*100))+'%"></i></div>',portrait=p=>'<canvas data-person="'+p.id+'" aria-label="'+esc(p.name)+'"></canvas>',by=id=>s.roster.find(p=>p.id===id);
function cardArt(id,index,disabled,sel){let c=E.cards[id];return '<button class="card '+(sel?'selected':'')+'" data-kind="'+c[5]+'" data-a="card:'+index+'" '+(disabled?'disabled':'')+'><span class="cost">'+c[2]+'</span><span class="kind">'+c[5]+'</span><span class="symbol">'+c[1]+'</span><b>'+c[0]+'</b><span class="desc">'+c[4]+'</span></button>'}
function person(p,offer){let r=E.roles[p.role],t=E.talents[p.talent];return '<article class="person">'+portrait(p)+'<div><b>'+esc(p.name)+'</b> <small>'+r.name+'</small><p class="tag">'+t.name+' · '+t.desc+'</p><p class="stat">HP '+p.hp+' · 才能 '+'◆'.repeat(p.potential)+' · '+esc(p.origin)+'</p><p class="stat">固有：'+E.cards[p.signature][0]+'</p></div><div>'+b(offer?'採用1':'配置',offer?'recruit:'+p.id:'assign:'+p.id,!!s.run||(offer?s.coins<1||s.roster.length>=40:s.party[slot]===p.id),'alt')+(!offer?b('デッキ','detail:'+p.id,false,'alt'):'')+'</div></article>'}
function home(){return hud([['募集令',s.coins],['所属',s.roster.length],['最深戦',s.record+'/3']])+'<div class="panel"><canvas id="land" class="art" width="320" height="118"></canvas><div class="screen-title"><div class="kicker">北方辺境 · 古代の砦</div><h2>英雄たちの遠征</h2><p class="muted">3人の英雄、3つの独立デッキ。仲間が生む連携を試し、戦利品のカードを持ち帰る。</p></div><div class="three">'+s.party.map(id=>{let p=by(id);return '<div class="slot">'+portrait(p)+'<b>'+esc(p.name)+'</b><br><small>'+E.roles[p.role].name+' · '+E.talents[p.talent].name+'</small></div>'}).join('')+'</div>'+b(s.run?'遠征へ戻る':'遠征開始','start',false,'full')+b('募集・編成・デッキを見る','tab:roster',false,'alt full')+'</div><div class="panel"><h3>王国の記録</h3><p>帰還 '+s.runs+'回 · 人物と習得カードを永続保存</p><p class="muted">戦闘ごとに獲得するカードは遠征中のみ。帰還時に1枚を習得できる。</p></div>'}
function roster(){let h=hud([['募集令',s.coins],['所属',s.roster.length],['帰還',s.runs]])+'<div class="panel"><h3>遠征編成</h3><p class="muted">枠を選び、所属人物の「配置」を押す。</p><div class="three">'+s.party.map((id,i)=>{let p=by(id);return b(portrait(p)+esc(p.name)+'<br><small>'+E.roles[p.role].name+'</small>','slot:'+i,false,'slot '+(i===slot?'sel':'alt'))}).join('')+'</div></div>';
if(detail!==null){let p=by(detail);if(p){h+='<div class="panel"><div class="row"><h3>'+esc(p.name)+' の独立デッキ</h3>'+b('閉じる','close',false,'alt')+'</div><p class="tag">'+E.talents[p.talent].desc+'</p><div class="deckmini">'+p.deck.map((c,i)=>learn?b(E.cards[c][0],'replace:'+i,!!s.run||c===p.signature,'alt'):'<span>'+E.cards[c][0]+(c===p.signature?' ★':'')+'</span>').join('')+'</div><h3>永続習得カード</h3><p class="stat">習得カードを選び、上の入れ替えるカードをタップ。固有カードは固定。</p><div class="deckmini">'+(p.learned.length?p.learned.map(c=>b(E.cards[c][0],'learn:'+c,!!s.run,learn===c?'sel':'alt')).join(''):'<small>まだ習得していない</small>')+'</div></div>'}}
return h+'<div class="panel"><h3>所属人物</h3>'+s.roster.map(p=>person(p,false)).join('')+'</div><div class="panel"><div class="row"><h3>志願者</h3>'+b('探索1','scout',!!s.run||s.coins<1,'alt')+'</div><p class="muted">重複しない生成人物。才能と固有カードを比較しよう。</p>'+s.offers.map(p=>person(p,true)).join('')+'</div>'}
function battle(){let r=s.run;if(!r)return '<div class="panel"><h2>出撃準備</h2>'+b('遠征開始','start',false,'full')+'</div>';if(r.phase!=='battle')return outcome(r);
if(r.heroes[active]?.hp<=0)active=Math.max(0,r.heroes.findIndex(h=>h.hp>0));let h=r.heroes[active],c=E.cards[h.hand[card]];let target=c?(c[3]==='enemy'?'攻撃対象の敵をタップ':'対象の味方をタップ'):'カードを選択';
return hud([['戦闘',r.stage+'/3'],['ターン',r.turn],['連携',r.link]])+'<div class="panel battlehead"><div class="row"><h3>'+['霧の街道','黒樹の遺跡','星落ちの祭壇'][r.stage-1]+'</h3><small>敵の次の行動</small></div><canvas id="field" class="art" width="320" height="118"></canvas><div class="enemygrid">'+r.enemies.map(e=>'<div class="enemy '+(c&&c[3]==='enemy'&&e.hp>0?'selected':'')+'"><button data-a="enemy:'+e.id+'" '+(e.hp<=0?'disabled':'')+'><b>'+e.name+'</b>'+bar(e.hp,e.max)+'<small>HP '+e.hp+'/'+e.max+'</small><div class="intent">'+(e.hp<=0?'撃破':e.kind==='all'?'全員に '+e.atk:'→ '+esc(r.heroes.find(h=>h.id===e.target)?.name||'')+' に '+e.atk)+'</div><div class="status">'+(e.break?'破甲 '+e.break+' ':'')+(e.burn?'火傷 '+e.burn+' ':'')+(e.mark?'印 '+e.mark:'')+'</div></button></div>').join('')+'</div><div class="three">'+r.heroes.map((p,i)=>b(portrait(p)+'<b>'+esc(p.name)+'</b>'+bar(p.hp,p.max)+'<small>HP '+p.hp+' / 防 '+p.block+'</small><small>◆ '+p.energy+' · 手札 '+p.hand.length+'</small>','hero:'+i,p.hp<=0,'hero '+(i===active?'sel':'alt'))).join('')+'</div></div><div class="panel"><div class="row"><div><h3>'+esc(h.name)+' の手札</h3><small>'+E.talents[h.talent].name+' · 行動力 '+h.energy+'</small></div><small>山札 '+h.deck.length+' / 捨札 '+h.discard.length+'</small></div><div class="targethint">'+target+'</div><div class="hand">'+h.hand.map((id,i)=>cardArt(id,i,!E.affordable(h,id),card===i)).join('')+'</div>'+b('ターン終了 · 敵の行動','end',false,'full')+'<p class="stat">味方を切り替えて自由な順序で行動。行動力と手札は人物ごとに独立。</p></div><div class="panel"><h3>戦況記録 · 最大 '+r.best+'連鎖</h3><div class="log">'+r.log.map(esc).join('\n')+'</div></div>'}
function outcome(r){let h='<div class="panel"><div class="kicker">EXPEDITION '+r.stage+'/3</div><h2>'+({reward:'戦利品を選ぶ',return:'遠征制覇！',defeat:'遠征から撤退'})[r.phase]+'</h2><p class="muted">'+(r.phase==='reward'?'1枚選ぶと、その人物の遠征デッキに加わる。':'今回獲得したカードのうち1枚を、人物が永続習得できる。')+'</p>';
let a=r.phase==='reward'?r.rewards:r.permanent;h+=a.map((q,i)=>{let c=E.cards[q.card],p=r.heroes.find(p=>p.id===q.id);return '<div class="choice"><div class="row"><b class="link">'+c[1]+' '+c[0]+'</b><small>'+esc(p.name)+' · コスト '+c[2]+'</small></div><p>'+c[4]+'</p>'+b(r.phase==='reward'?'獲得して進む':'習得して帰還',(r.phase==='reward'?'reward:':'return:')+i,false,'full')+'</div>'}).join('');return h+b(r.phase==='reward'?'カードを取らず進む':'習得せず帰還',(r.phase==='reward'?'reward:':'return:')+'-1',false,'alt full')+'</div><div class="panel"><h3>遠征記録</h3><div class="log">'+r.log.map(esc).join('\n')+'</div></div>'}
function drawArt(){if(!P)return;let people=[...s.roster,...s.offers];if(s.run)people=[...s.run.heroes,...people];document.querySelectorAll('canvas[data-person]').forEach(c=>{let p=people.find(p=>p.id===+c.dataset.person);if(p){let r=E.roles[p.role];P.draw(c,P.make('destiny:'+p.id+':'+p.name,{species:'human',job:r.job,armor:r.armor,weapon:r.weapon}),2)}});let c=$('land')||$('field');if(!c)return;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,118);g.addColorStop(0,'#263d46');g.addColorStop(1,'#b0a07c');x.fillStyle=g;x.fillRect(0,0,320,118);let rect=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};rect(250,14,16,16,'#f1db9e');for(let j=0;j<3;j++){x.fillStyle=['#62756c','#475e52','#344b3e'][j];x.beginPath();x.moveTo(0,100);for(let i=0;i<9;i++)x.lineTo(i*41,28+j*20+Math.sin(i*2+j)*15);x.lineTo(320,118);x.lineTo(0,118);x.fill()}rect(0,94,320,24,'#3f4c37');rect(0,105,320,9,'#837355');if(c.id==='land'){for(let i=0;i<3;i++){rect(121+i*29,45-i%2*8,24,54+i%2*8,'#a49a81');for(let j=0;j<3;j++)rect(121+i*29+j*8,40-i%2*8,6,8,'#a49a81')}rect(145,80,22,24,'#403e31')}else if(s.run){let r=s.run;r.heroes.forEach((p,i)=>{if(p.hp>0){let j=E.roles[p.role];P.render(x,P.make('destiny:'+p.id+':'+p.name,{species:'human',job:j.job,weapon:j.weapon,armor:j.armor}),15+i*34,67,1)}});r.enemies.forEach((e,i)=>{if(e.hp<=0)return;let a=208+i*45;if(e.art==='wolf'){rect(a,86,27,14,'#635046');rect(a+22,78,13,15,'#7f6857');rect(a+3,100,4,6,'#42362c');rect(a+22,100,4,6,'#42362c');rect(a+29,83,3,3,'#efd08a')}else if(e.art==='spirit'){rect(a+8,72,18,31,'#789c8d');rect(a+3,82,28,13,'#a3c7a4');rect(a+11,78,3,3,'#f0dd8f');rect(a+21,78,3,3,'#f0dd8f')}else{rect(a+6,65,24,39,'#6c7471');rect(a+9,57,18,15,'#a3a294');rect(a+2,75,9,21,'#b7b3a1');rect(a+28,75,9,21,'#8c8c80');rect(a+12,62,3,3,'#e9a36e');rect(a+22,62,3,3,'#e9a36e');if(e.art==='dragon'){rect(a-12,70,22,8,'#8d5f57');rect(a+27,65,15,13,'#8d5f57')}}})}}
function render(){$('notice').textContent=notice;$('nav').innerHTML=[['home','王国'],['roster','人物・デッキ'],['battle','遠征']].map(([k,v])=>b(v,'tab:'+k,false,k===tab?'active':'alt')).join('');$('view').innerHTML=({home,roster,battle}[tab])();drawArt()}
document.addEventListener('click',ev=>{let z=ev.target.closest('button[data-a]');if(!z||z.disabled)return;let [a,i]=z.dataset.a.split(':'),n=Number(i),r=s.run;const use=(target)=>{if(r&&r.phase==='battle'&&E.play(s,r.heroes[active].id,card,target))card=-1};
if(a==='tab'){tab=i;card=-1}else if(a==='start'){if(!s.run)E.start(s);tab='battle';active=0;card=-1}else if(a==='slot')slot=n;else if(a==='recruit')E.recruit(s,n);else if(a==='scout')E.scout(s);else if(a==='assign')E.assign(s,slot,n);else if(a==='detail'){detail=n;learn=null}else if(a==='close'){detail=null;learn=null}else if(a==='learn')learn=i;else if(a==='replace'){if(E.equip(s,detail,learn,n))learn=null}else if(a==='hero'&&r?.phase==='battle'){let c=E.cards[r.heroes[active].hand[card]];if(c?.[3]==='ally')use(r.heroes[n].id);else{active=n;card=-1}}else if(a==='enemy'&&r?.phase==='battle')use(i);else if(a==='card'&&r?.phase==='battle'){card=n;let c=E.cards[r.heroes[active].hand[n]];if(c?.[3]==='self')use(r.heroes[active].id)}else if(a==='end'){E.end(s);card=-1}else if(a==='reward'){E.reward(s,n);active=0;card=-1}else if(a==='return'){E.returnHome(s,n);tab='home';detail=null;learn=null;notice='帰還しました。新しい人物を探そう。'}save();render()});render();save();
</script></body></html>
